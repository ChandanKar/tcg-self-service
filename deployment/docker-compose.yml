services:

  # ---------------------------------------------------------------------------
  # MySQL 8 — production database (data in named volume, survives restarts)
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: vmcontrol-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vmcontrol}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mysql/data:/var/lib/mysql
    networks:
      - vmcontrol-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Application — Spring Boot fat JAR
  #
  # Deploy workflow:
  #   1. Build:   ./gradlew bootJar  (from project root)
  #   2. Copy:    cp build/libs/vmcontrol-*.jar deployment/app/vmcontrol.jar
  #   3. Restart: docker compose restart app
  # ---------------------------------------------------------------------------
  app:
    image: amazoncorretto:17-alpine
    container_name: vmcontrol-app
    # A fixed hostname (U21-T22): each operation records the host that runs it, and at startup the app
    # fails the runs its own host left behind. Without this a recreated container (every deploy) gets a
    # new random hostname, so an operation cut off by the deploy stayed "In progress", blocking its
    # environment, until the 30-minute stale sweep.
    hostname: vmcontrol-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    # Memory (U26-T01). Staging (-Xmx512m in a 768 MiB cap) was killed without a word when a burst of
    # admin reads grew the heap to its maximum: the JVM also needs ~300 MB beyond the heap (metaspace
    # ~130 MB, code cache ~65 MB, symbols, threads, GC, native buffers), so heap + the rest passed the
    # cap and the kernel killed the container before Java could report anything. Keep the cap at least
    # 300 MB above -Xmx (APP_HEAP_MAX); the flags below make a real out-of-memory exit at once, with a
    # heap dump, an error file and a GC log in ./logs (the dump is as large as the heap: move it away
    # after reading it, the JVM does not overwrite an existing one).
    mem_limit: ${APP_MEM_LIMIT:-1g}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: >-
        -Xmx${APP_HEAP_MAX:-512m}
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=192m
        -XX:ReservedCodeCacheSize=96m
        -XX:MaxDirectMemorySize=64m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/app/logs/vmcontrol-oom.hprof
        -XX:ErrorFile=/app/logs/hs_err_pid%p.log
        -Xlog:gc,gc+heap+exit:file=/app/logs/gc.log:time,uptime:filecount=3,filesize=5m
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AZURE_REDIRECT_URI: https://selfservice-new.tcgdigital.com/login/oauth2/code/azure
    volumes:
      - ./app:/app
      - ./logs:/app/logs
      - ./config/application-prod.properties:/app/config/application-prod.properties:ro
    working_dir: /app
    command: [
      "java",
      "-Dspring.security.oauth2.client.registration.azure.redirect-uri=https://selfservice-new.tcgdigital.com/login/oauth2/code/azure",
      "-jar", "vmcontrol.jar"
    ]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - vmcontrol-net

  # ---------------------------------------------------------------------------
  # Nginx — reverse proxy; terminates HTTP, forwards to app on port 8080
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: vmcontrol-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - vmcontrol-net

networks:
  vmcontrol-net:
    driver: bridge
