# =============================================================================
# Production Profile Configuration — server-side override file
# Mounted into the container at /app/config/application-prod.properties
# Spring Boot reads this directory automatically (higher priority than the JAR).
# Edit this file on the server to change settings without rebuilding the JAR.
# =============================================================================

# Disable H2 console in production (security requirement)
spring.h2.console.enabled=false

# Disable SQL logging in production
spring.jpa.show-sql=false

# Stricter JPA settings for production
spring.jpa.hibernate.ddl-auto=validate

# Flyway - don't clean on validation errors in production
spring.flyway.clean-on-validation-error=false
spring.flyway.clean-disabled=true

# Logging - write to file for persistence and host-side access
logging.file.name=/app/logs/vmcontrol.log
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=500MB


# Trust X-Forwarded-Proto from Nginx so OAuth2 redirect URIs are built as https://
#server.forward-headers-strategy=native
spring.security.oauth2.client.registration.azure.redirect-uri=https://selfservice-new.tcgdigital.com/login/oauth2/code/azure

# Disable detailed error messages in production
#server.error.include-stacktrace=never
#server.error.include-message=never

# Entra ID should always be enabled in production
entraid.enabled=true


COST_TAGGING_ENABLED=false
COST_TAGGING_KEY_PREFIX=tcg:
COST_TAGGING_CRON=0 30 2 * * *

COST_ACTUALS_ENABLED=false
COST_ACTUALS_CRON=0 0 5 * * *

COST_OPTIMIZER_ENABLED=false
COST_RESERVATIONS_ENABLED=false
COST_RESERVATIONS_CRON=0 15 5 * * *
