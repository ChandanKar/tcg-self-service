<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add VMs from AWS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F4A9E}a:hover{color:#14245C}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #141B2D; background: #F3F5F9; min-height: 900px; display: flex; flex-direction: column; position: relative">
  <div style="position: sticky; top: 0; z-index: 20"><dc-import name="TopBar" role="envadmin" hint-size="100%,56px"></dc-import></div>
  <div style="display: flex; flex-wrap: wrap; flex: 1">
    <div style="flex: 0 0 240px; position: sticky; top: 56px; align-self: flex-start; z-index: 10"><dc-import name="SideNav" role="envadmin" active="registry" height="844px" hint-size="240px,844px"></dc-import></div>
    <main aria-hidden="true" style="flex: 999 1 560px; min-width: 0; padding: 20px 32px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
      <div style="font-size: 28px; font-weight: 600; letter-spacing: -0.02em">VM registry</div>
      <div style="height: 560px; background: #FFFFFF; border: 1px solid #E1E6EF; border-radius: 12px"></div>
    </main>
  </div>

  <div style="position: absolute; inset: 0; z-index: 30; background: rgba(10,20,48,0.42); display: flex; align-items: flex-start; justify-content: center; padding: 40px 24px; box-sizing: border-box">
    <div role="dialog" aria-modal="true" aria-labelledby="reg-title" style="width: 100%; max-width: 900px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 24px 48px rgba(20,36,92,0.25); overflow: hidden">
      <div style="padding: 18px 24px 12px; border-bottom: 1px solid #EEF1F5">
        <h2 id="reg-title" style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Add VMs to Payments Dev</h2>
        <p style="margin: 3px 0 0; font-size: 14px; color: #5B6478">Pick instances from AWS. They join a group and start in its order.</p>
      </div>
      <div style="padding: 14px 24px 10px; display: flex; gap: 10px; flex-wrap: wrap; align-items: end">
        <div role="group" aria-label="Kind" style="display: inline-flex; border: 1px solid #D4DAE5; border-radius: 8px; padding: 2px; gap: 2px">
          <button type="button" aria-pressed="true" style="border: 0; font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; background: #14245C; color: #FFFFFF; font-weight: 500">Servers (EC2)</button>
          <button type="button" aria-pressed="false" style="border: 0; font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; background: transparent; color: #3A4256">Databases (RDS)</button>
        </div>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: #3A4256">AWS account<select style="height: 34px; border: 1px solid #D4DAE5; border-radius: 8px; padding: 0 8px; font: inherit; font-size: 13.5px; color: #141B2D"><option>Engineering</option><option>Data platform</option></select></label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: #3A4256">Region<select style="height: 34px; border: 1px solid #D4DAE5; border-radius: 8px; padding: 0 8px; font: inherit; font-size: 13.5px; color: #141B2D"><option>ap-south-1 (Mumbai)</option><option>us-east-1</option></select></label>
        <label style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: #3A4256">Search<input type="search" placeholder="Name tag or IP" style="height: 34px; border: 1px solid #D4DAE5; border-radius: 8px; padding: 0 10px; font: inherit; font-size: 13.5px"></label>
      </div>
      <table style="width: 100%; border-collapse: collapse; font-size: 14px">
        <thead><tr style="background: #F7F8FB; color: #5B6478; font-size: 12.5px; text-align: left">
          <th scope="col" style="padding: 8px 24px; width: 30px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Select</span></th><th scope="col" style="padding: 8px 8px; font-weight: 500">Name</th><th scope="col" style="padding: 8px 8px; font-weight: 500">Size</th><th scope="col" style="padding: 8px 8px; font-weight: 500">Zone</th><th scope="col" style="padding: 8px 8px; font-weight: 500">IP address</th><th scope="col" style="padding: 8px 8px; font-weight: 500">State</th><th scope="col" style="padding: 8px 24px 8px 8px; font-weight: 500">Note</th>
        </tr></thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
            <tr style="border-top: 1px solid #EEF1F5; {{r.rowStyle}}">
              <td style="padding: 8px 24px"><input type="checkbox" checked="{{r.checked}}" disabled="{{r.taken}}" onChange="{{r.toggle}}" aria-label="Select {{r.name}}" style="width: 16px; height: 16px; accent-color: #14245C"></td>
              <td style="padding: 8px; font-weight: 500">{{r.name}}</td>
              <td style="padding: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px">{{r.size}}</td>
              <td style="padding: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px">{{r.zone}}</td>
              <td style="padding: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px">{{r.ip}}</td>
              <td style="padding: 8px">{{r.state}}</td>
              <td style="padding: 8px 24px 8px 8px; font-size: 13px; color: #5B6478">{{r.note}}</td>
            </tr>
          </sc-for>
        </tbody>
      </table>
      <div style="display: flex; gap: 12px; align-items: end; padding: 14px 24px; border-top: 1px solid #E1E6EF; background: #FAFBFD; flex-wrap: wrap">
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: #3A4256">Add to group<select style="height: 36px; border: 1px solid #D4DAE5; border-radius: 8px; padding: 0 8px; font: inherit; font-size: 14px; color: #141B2D"><option>Web · starts 3rd</option><option>Application · starts 2nd</option><option>Database · starts 1st</option><option>New group…</option></select></label>
        <span style="flex: 1; font-size: 13.5px; color: #5B6478">{{count}} selected · they start after the group's current VMs</span>
        <a href="VmRegistry.dc.html" style="display: inline-flex; align-items: center; height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid #D4DAE5; color: #141B2D; text-decoration: none; font-weight: 500; font-size: 14px">Cancel</a>
        <a href="VmRegistry.dc.html" style="display: inline-flex; align-items: center; height: 38px; padding: 0 16px; border-radius: 8px; background: #14245C; color: #FFFFFF; text-decoration: none; font-weight: 500; font-size: 14px">{{cta}}</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: ['web-03', 'web-04'] }; }
  renderVals() {
    const list = [
      ['web-03', 't3.medium', 'ap-south-1a', '10.20.3.43', 'Stopped', ''],
      ['web-04', 't3.medium', 'ap-south-1b', '10.20.3.44', 'Stopped', ''],
      ['pay-worker-01', 'c6i.large', 'ap-south-1a', '10.20.4.11', 'Running', 'Found by discovery, not in a group'],
      ['pay-worker-02', 'c6i.large', 'ap-south-1b', '10.20.4.12', 'Running', 'Found by discovery, not in a group'],
      ['analytics-etl', 'r6i.large', 'ap-south-1a', '10.30.1.20', 'Running', 'Already in Analytics QA'],
      ['bastion', 't3.micro', 'ap-south-1a', '10.20.0.5', 'Running', 'Already in Payments Dev'],
      ['(no name tag)', 't3.small', 'ap-south-1c', '10.20.9.31', 'Stopped', '']
    ];
    const picked = this.state.picked;
    const rows = list.map(([name, size, zone, ip, state, note]) => {
      const taken = note.startsWith('Already');
      return { name, size, zone, ip, state, note, taken, checked: picked.includes(name),
        rowStyle: taken ? 'color:#9AA4B8' : '',
        toggle: () => this.setState({ picked: picked.includes(name) ? picked.filter(p => p !== name) : picked.concat([name]) }) };
    });
    const n = picked.length;
    return { rows, count: n, cta: n ? `Add ${n} VM${n === 1 ? '' : 's'}` : 'Pick VMs to add' };
  }
}
</script>
</body>
</html>
