      <a href="ApprovalPolicies.dc.html" style="{{st.policies}}"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.5 4 5v4.5c0 3.8 2.6 6.5 6 8 3.4-1.5 6-4.2 6-8V5z"></path></svg>Approval policies</a>
      <a href="Budgets.dc.html" style="{{st.budgets}}"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="14" height="11" rx="2"></rect><path d="M13 10.5h4M3 8h11" stroke-linecap="round"></path></svg>Budgets</a>
      <a href="AuditLog.dc.html" style="{{st.audit}}"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M5 2.5h7l3.5 3.5v11.5H5z M12 2.5V6h3.5 M8 10h5M8 13h5"></path></svg>Audit log</a>
    </div>

  <sc-if value="{{showAdmin}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 0">

      <a href="Teams.dc.html" style="{{st.teams}}"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7.5" r="2.5"></circle><circle cx="13.5" cy="7.5" r="2.5"></circle><path d="M2.5 16c0-2.4 2-4 4.5-4s4.5 1.6 4.5 4M11 12.6c.7-.4 1.6-.6 2.5-.6 2.5 0 4.5 1.6 4.5 4"></path></svg>Teams</a>
      <a href="AwsAccounts.dc.html" style="{{st.aws}}"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 16h8.5a3.5 3.5 0 0 0 .4-7 5 5 0 0 0-9.6 1.4A2.9 2.9 0 0 0 6 16z"></path></svg>AWS accounts</a>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["user","viewer","envadmin","admin"],"default":"user"},"active":{"editor":"text","default":"home"},"showApprovals":{"editor":"boolean","default":true},"height":{"editor":"text","default":"844px"},"$preview":{"width":240,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const role = this.props.role ?? 'user';
    const active = this.props.active ?? 'home';
    const base = 'display:flex;align-items:center;gap:10px;height:30px;padding:0 12px;margin:0 10px;border-radius:7px;text-decoration:none;font-size:13.5px;';
    const keys = ['home', 'environments', 'request', 'approvals', 'activity', 'requests', 'access', 'registry', 'schedules',
      'policies', 'budgets', 'audit', 'cost', 'savings', 'waste', 'chargeback', 'users', 'teams', 'aws', 'api', 'settings', 'health', 'help'];
    const st = {};
    keys.forEach(k => {
      st[k] = base + (k === active
        ? 'background:#ECEFF8;color:#14245C;font-weight:600;box-shadow:inset 3px 0 0 #D9A21B'
        : 'color:#2A3245;font-weight:400');
    });
    return {
      st,
      homeHref: role === 'admin' ? 'AdminDashboard.dc.html' : 'Dashboard.dc.html',
      showApprovals: this.props.showApprovals ?? true,
      showManage: role === 'envadmin' || role === 'admin',
      showAdmin: role === 'admin',
      height: this.props.height ?? '844px'
    };
  }
}
</script>
</body>
</html>
