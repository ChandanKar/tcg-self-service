<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Teams</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F4A9E}a:hover{color:#14245C}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #141B2D; background: #F3F5F9; min-height: 900px; display: flex; flex-direction: column">
  <div style="position: sticky; top: 0; z-index: 20"><dc-import name="TopBar" role="admin" hint-size="100%,56px"></dc-import></div>
  <div style="display: flex; flex-wrap: wrap; flex: 1">
    <div style="flex: 0 0 240px; position: sticky; top: 56px; align-self: flex-start; z-index: 10"><dc-import name="SideNav" role="admin" active="teams" height="844px" hint-size="240px,844px"></dc-import></div>
    <main style="flex: 999 1 560px; min-width: 0; padding: 24px 32px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
        <div>
          <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Teams</h1>
          <p style="margin: 6px 0 0; font-size: 15px; color: #5B6478">Who owns which environments, which cost centre pays, and each team's monthly limit.</p>
        </div>
        <a href="Teams.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 8px; background: #14245C; color: #FFFFFF; text-decoration: none; font-weight: 500; font-size: 14px">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M10 4v12M4 10h12"></path></svg>New team</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px">
        <sc-for list="{{teams}}" as="t" hint-placeholder-count="4">
          <article style="background: #FFFFFF; border: 1px solid #E1E6EF; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
            <div style="display: flex; justify-content: space-between; gap: 12px; align-items: baseline">
              <h2 style="margin: 0; font-size: 17px; font-weight: 600">{{t.name}}</h2>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #5B6478">{{t.cc}}</span>
            </div>
            <div style="font-size: 13px; color: #5B6478">{{t.members}}</div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <sc-for list="{{t.envs}}" as="e" hint-placeholder-count="2">
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px"><span>{{e.name}}</span><dc-import name="PowerStrip" states="{{e.states}}" hint-size="140px,20px"></dc-import></div>
              </sc-for>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 1px solid #EEF1F5">
              <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: #5B6478">VM hours this month</span><span style="font-family: 'IBM Plex Mono', monospace">{{t.quota}}</span></div>
              <div role="img" aria-label="{{t.quotaLabel}}" style="height: 6px; border-radius: 3px; background: #ECEFF5; overflow: hidden"><div style="{{t.quotaBar}}"></div></div>
            </div>
            <div style="display: flex; gap: 14px; font-size: 13px"><a href="Teams.dc.html" style="text-decoration: none">Edit</a><a href="Teams.dc.html" style="text-decoration: none">Members</a><a href="Teams.dc.html" style="text-decoration: none">Environments</a></div>
          </article>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const t = (name, cc, members, envs, used, limit) => ({
      name, cc, members, envs: envs.map(([n, s]) => ({ name: n, states: s })),
      quota: `${used.toLocaleString('en-US')} / ${limit.toLocaleString('en-US')}`,
      quotaLabel: `${Math.round(used / limit * 100)}% of the monthly VM hours used`,
      quotaBar: `height:100%;width:${Math.min(100, used / limit * 100)}%;background:${used / limit > 0.9 ? '#C2412D' : '#14245C'}`
    });
    const teams = [
      t('Payments', 'CC-4105', '6 people · synced from Entra group "Payments Engineering"', [['Payments Dev', 'RRR|RR|SS']], 1840, 4000),
      t('Data', 'CC-4410', '9 people', [['Data Lake Dev', 'RRRRRR'], ['Analytics QA', 'RRB|RS']], 5120, 6000),
      t('CRM', 'CC-4300', '4 people', [['CRM UAT', 'SS|SSS|S']], 2890, 3000),
      t('People', 'CC-4510', '3 people', [['HR Portal Staging', 'SSSS|SS']], 410, 1500)
    ];
    return { teams };
  }
}
</script>
</body>
</html>
