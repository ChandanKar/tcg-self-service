<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Environment on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F4A9E}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #141B2D; background: #F3F5F9; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 56px; flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #E1E6EF; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 4px">
    <a href="PhoneHome.dc.html" aria-label="Back to environments" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #141B2D">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 4-6 6 6 6"></path></svg></a>
    <span style="flex: 1; font-size: 16px; font-weight: 600">Payments Dev</span>
    <a href="MyActivity.dc.html" style="font-size: 14px; text-decoration: none; padding: 10px">History</a>
  </header>
  <main style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <section aria-label="State" style="background: #FFFFFF; border: 1px solid #E1E6EF; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 14px"><b style="font-family: 'IBM Plex Mono', monospace; font-weight: 500">5</b> of <b style="font-family: 'IBM Plex Mono', monospace; font-weight: 500">7</b> VMs running</div>
      <dc-import name="PowerStrip" states="RRR|RR|SS" large="{{ true }}" show-count="{{ false }}" hint-size="200px,24px"></dc-import>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #5B6478"><span>Database</span><span>Application</span><span>Web</span></div>
      <a href="StartConfirm.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 46px; border-radius: 10px; background: #12915E; color: #FFFFFF; text-decoration: none; font-weight: 500; font-size: 15px">
        <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M6 4v12l10-6z"></path></svg>Start the 2 stopped</a>
      <a href="PhoneEnv.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 10px; border: 1px solid #E8B8AE; color: #A8331F; text-decoration: none; font-weight: 500; font-size: 15px">Stop all</a>
    </section>
    <section aria-label="Details" style="background: #FFFFFF; border: 1px solid #E1E6EF; border-radius: 12px; overflow: hidden">
      <div style="display: flex; justify-content: space-between; padding: 12px 16px; font-size: 14px"><span style="color: #5B6478">Lease</span><span>Stops <span style="font-family: 'IBM Plex Mono', monospace">20:00</span> · <a href="PhoneEnv.dc.html" style="text-decoration: none">Extend</a></span></div>
      <div style="display: flex; justify-content: space-between; padding: 12px 16px; font-size: 14px; border-top: 1px solid #EEF1F5"><span style="color: #5B6478">Lock</span><span>Not locked · <a href="PhoneEnv.dc.html" style="text-decoration: none">Lock</a></span></div>
      <div style="display: flex; justify-content: space-between; padding: 12px 16px; font-size: 14px; border-top: 1px solid #EEF1F5"><span style="color: #5B6478">This month</span><span style="font-family: 'IBM Plex Mono', monospace">$186.40</span></div>
    </section>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <button type="button" aria-expanded="false" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 0 16px; background: #FFFFFF; border: 1px solid #E1E6EF; border-radius: 12px; font: inherit; color: #141B2D; cursor: pointer">
        <span style="flex: 1; text-align: left; font-size: 15px; font-weight: 600">{{g.name}}</span>
        <dc-import name="PowerStrip" states="{{g.states}}" hint-size="70px,20px"></dc-import>
        <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="#5B6478" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 5 5 5-5 5"></path></svg>
      </button>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { groups: [{ name: 'Database', states: 'RRR' }, { name: 'Application', states: 'RR' }, { name: 'Web', states: 'SS' }] };
  }
}
</script>
</body>
</html>
