<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My activity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F4A9E}a:hover{color:#14245C}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #141B2D; background: #F3F5F9; min-height: 900px; display: flex; flex-direction: column">
  <div style="position: sticky; top: 0; z-index: 20"><dc-import name="TopBar" role="user" hint-size="100%,56px"></dc-import></div>
  <div style="display: flex; flex-wrap: wrap; flex: 1">
    <div style="flex: 0 0 240px; position: sticky; top: 56px; align-self: flex-start; z-index: 10"><dc-import name="SideNav" role="user" active="activity" height="844px" hint-size="240px,844px"></dc-import></div>
    <main style="flex: 999 1 560px; min-width: 0; padding: 24px 32px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
        <div>
          <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">My activity</h1>
          <p style="margin: 6px 0 0; font-size: 15px; color: #5B6478">What you started, stopped, locked and requested.</p>
        </div>
        <a href="MyActivity.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid #D4DAE5; background: #FFFFFF; color: #141B2D; text-decoration: none; font-weight: 500; font-size: 14px">
          <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v10M5.5 8.5 10 13l4.5-4.5M4 17h12"></path></svg>Export CSV</a>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center">
        <div role="group" aria-label="Period" style="display: inline-flex; background: #FFFFFF; border: 1px solid #D4DAE5; border-radius: 8px; padding: 3px; gap: 2px">
          <button type="button" aria-pressed="false" style="border: 0; font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; background: transparent; color: #3A4256">24 hours</button>
          <button type="button" aria-pressed="true" style="border: 0; font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; background: #14245C; color: #FFFFFF; font-weight: 500">7 days</button>
          <button type="button" aria-pressed="false" style="border: 0; font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; background: transparent; color: #3A4256">30 days</button>
          <button type="button" aria-pressed="false" style="border: 0; font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; background: transparent; color: #3A4256">Dates…</button>
        </div>
        <label style="font-size: 13px; color: #5B6478; display: flex; align-items: center; gap: 8px">Environment
          <select style="height: 36px; border: 1px solid #D4DAE5; border-radius: 8px; padding: 0 8px; font: inherit; font-size: 14px; color: #141B2D"><option>All</option><option>Payments Dev</option><option>Analytics QA</option><option>CRM UAT</option></select></label>
        <label style="font-size: 13px; color: #5B6478; display: flex; align-items: center; gap: 8px">Action
          <select style="height: 36px; border: 1px solid #D4DAE5; border-radius: 8px; padding: 0 8px; font: inherit; font-size: 14px; color: #141B2D"><option>All</option><option>Start and stop</option><option>Locks</option><option>Access</option></select></label>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E1E6EF; border-radius: 12px; overflow: hidden">
        <table style="width: 100%; border-collapse: collapse; font-size: 14px">
          <thead>
            <tr style="background: #F7F8FB; color: #5B6478; font-size: 12.5px; text-align: left">
              <th scope="col" style="padding: 12px 20px; font-weight: 500; width: 90px">Time</th>
              <th scope="col" style="padding: 12px; font-weight: 500">What</th>
              <th scope="col" style="padding: 12px; font-weight: 500">Environment</th>
              <th scope="col" style="padding: 12px 20px; font-weight: 500; text-align: right">Result</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
              <sc-if value="{{r.day}}" hint-placeholder-val="{{ false }}">
                <tr><td colspan="4" style="padding: 14px 20px 6px; font-size: 12.5px; font-weight: 600; color: #5B6478; background: #FAFBFD; border-top: 1px solid #EEF1F5">{{r.day}}</td></tr>
              </sc-if>
              <sc-if value="{{r.text}}" hint-placeholder-val="{{ true }}">
                <tr style="border-top: 1px solid #EEF1F5">
                  <td style="padding: 12px 20px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #5B6478">{{r.time}}</td>
                  <td style="padding: 12px">{{r.text}}<sc-if value="{{r.note}}" hint-placeholder-val="{{ false }}"><div style="font-size: 13px; color: #A8331F; margin-top: 2px">{{r.note}}</div></sc-if></td>
                  <td style="padding: 12px; color: #3A4256">{{r.env}}</td>
                  <td style="padding: 12px 20px; text-align: right"><span style="{{r.resultStyle}}">{{r.result}}</span></td>
                </tr>
              </sc-if>
            </sc-for>
          </tbody>
        </table>
        <div style="padding: 12px 20px; border-top: 1px solid #EEF1F5; font-size: 13px; color: #5B6478">9 actions in the last 7 days</div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = 'font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:#E3F4EC;color:#0B6B44';
    const bad = 'font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:#FBEEEB;color:#A8331F';
    const wait = 'font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:#FBF3DC;color:#7A5000';
    const rows = [
      { day: 'Today' },
      { time: '08:02', text: 'Started 5 VMs (Database, Application)', env: 'Payments Dev', result: 'Done', resultStyle: ok },
      { time: '07:58', text: 'Locked until 14:30 · "Data migration rehearsal"', env: 'Analytics QA', result: 'Done', resultStyle: ok },
      { time: '07:41', text: 'Asked for operator access, 30 days', env: 'Analytics QA', result: 'Waiting', resultStyle: wait },
      { day: 'Friday 17 October' },
      { time: '19:00', text: 'Stopped 6 VMs', env: 'CRM UAT', result: 'Done', resultStyle: ok },
      { time: '14:22', text: 'Started report-worker', env: 'Analytics QA', result: 'Failed', resultStyle: bad, note: 'AWS: InsufficientInstanceCapacity for r6i.xlarge in ap-south-1b. Try again or pick another size.' },
      { time: '09:14', text: 'Started Data Lake Dev for 12 hours (approved)', env: 'Data Lake Dev', result: 'Done', resultStyle: ok },
      { day: 'Wednesday 15 October' },
      { time: '11:30', text: 'Operator access approved by Sanjay Rao, 7 days', env: 'CRM UAT', result: 'Done', resultStyle: ok },
      { time: '10:05', text: 'Released lock', env: 'Payments Dev', result: 'Done', resultStyle: ok }
    ];
    return { rows };
  }
}
</script>
</body>
</html>
