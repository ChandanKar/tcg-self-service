<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyboard shortcuts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F4A9E}a:hover{color:#14245C}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;box-sizing:border-box;border:1px solid #D4DAE5;border-bottom-width:2px;border-radius:6px;background:#F7F8FB;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#141B2D}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #141B2D; background: #F3F5F9; min-height: 900px; display: flex; flex-direction: column; position: relative">
  <div style="position: sticky; top: 0; z-index: 20"><dc-import name="TopBar" role="user" hint-size="100%,56px"></dc-import></div>
  <div style="display: flex; flex-wrap: wrap; flex: 1">
    <div style="flex: 0 0 240px; position: sticky; top: 56px; align-self: flex-start; z-index: 10"><dc-import name="SideNav" role="user" active="environments" height="844px" hint-size="240px,844px"></dc-import></div>
    <main aria-hidden="true" style="flex: 999 1 560px; min-width: 0; padding: 20px 32px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
      <div style="font-size: 28px; font-weight: 600; letter-spacing: -0.02em">My environments</div>
      <div style="height: 580px; background: #FFFFFF; border: 1px solid #E1E6EF; border-radius: 12px"></div>
    </main>
  </div>
  <div style="position: absolute; inset: 0; z-index: 30; background: rgba(10,20,48,0.42); display: flex; align-items: flex-start; justify-content: center; padding: 96px 24px; box-sizing: border-box">
    <div role="dialog" aria-labelledby="ks-t" style="width: 460px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 24px 48px rgba(20,36,92,0.25); overflow: hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 8px"><h2 id="ks-t" style="margin: 0; font-size: 18px; font-weight: 600">Keyboard shortcuts</h2><a href="Environments.dc.html" aria-label="Close" style="display: inline-flex; width: 32px; height: 32px; align-items: center; justify-content: center; border-radius: 8px; color: #5B6478; text-decoration: none; font-size: 20px">×</a></div>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <div style="padding: 6px 20px 10px">
          <h3 style="margin: 0 0 4px; font-size: 12.5px; font-weight: 500; color: #5B6478">{{g.title}}</h3>
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-top: 1px solid #F1F3F7; font-size: 14px"><span>{{r.label}}</span><span style="display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: #5B6478"><kbd>{{r.k1}}</kbd><span sc-if="{{r.k2}}" style="display: inline-flex; gap: 4px; align-items: center">then<kbd>{{r.k2}}</kbd></span></span></div>
          </sc-for>
        </div>
      </sc-for>
      <p style="margin: 0; padding: 10px 20px 16px; font-size: 12.5px; color: #5B6478; background: #FAFBFD; border-top: 1px solid #E1E6EF">Shortcuts don't fire while you type in a field or while a dialog is open. Ctrl and Alt combinations stay the browser's.</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const r = (label, k1, k2) => ({ label, k1, k2: k2 || '' });
    const groups = [
      { title: 'Go to', rows: [r('Home', 'g', 'd'), r('My environments', 'g', 'e'), r('Request access', 'g', 'r'), r('My activity', 'g', 'a')] },
      { title: 'On any page', rows: [r('Refresh what you see', 'r'), r('Show this list', '?'), r('Close a dialog or panel', 'Esc')] }
    ];
    return { groups };
  }
}
</script>
</body>
</html>
