<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Starting CRM UAT</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F4A9E}a:hover{color:#14245C}
@keyframes pulse{50%{opacity:.4}}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #141B2D; background: #F3F5F9; min-height: 900px; display: flex; flex-direction: column; position: relative">
  <div style="position: sticky; top: 0; z-index: 20"><dc-import name="TopBar" role="user" hint-size="100%,56px"></dc-import></div>
  <div style="display: flex; flex-wrap: wrap; flex: 1">
    <div style="flex: 0 0 240px; position: sticky; top: 56px; align-self: flex-start; z-index: 10"><dc-import name="SideNav" role="user" active="environments" height="844px" hint-size="240px,844px"></dc-import></div>
    <main aria-hidden="true" style="flex: 999 1 560px; min-width: 0; padding: 20px 32px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
      <div style="font-size: 13px; color: #5B6478">Environments / CRM UAT</div>
      <div style="font-size: 28px; font-weight: 600; letter-spacing: -0.02em">CRM UAT</div>
      <div style="height: 520px; background: #FFFFFF; border: 1px solid #E1E6EF; border-radius: 12px"></div>
    </main>
  </div>

  <div style="position: absolute; inset: 0; z-index: 30; background: rgba(10,20,48,0.42); display: flex; align-items: flex-start; justify-content: center; padding: 56px 24px; box-sizing: border-box">
    <div role="dialog" aria-modal="true" aria-labelledby="op-title" style="width: 100%; max-width: 760px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 24px 48px rgba(20,36,92,0.25); overflow: hidden">
      <div style="padding: 20px 24px 14px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
          <h2 id="op-title" style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Starting CRM UAT</h2>
          <span style="font-size: 13.5px; color: #5B6478"><span style="font-family: 'IBM Plex Mono', monospace; color: #141B2D">1:42</span> so far · usually about <span style="font-family: 'IBM Plex Mono', monospace; color: #141B2D">4 min</span></span>
        </div>
        <div role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="3" aria-label="3 of 6 VMs running" style="height: 8px; border-radius: 4px; background: #ECEFF5; overflow: hidden"><div style="width: 50%; height: 100%; background: #12915E"></div></div>
        <div aria-live="polite" style="font-size: 14px"><b style="font-family: 'IBM Plex Mono', monospace; font-weight: 500">3</b> of <b style="font-family: 'IBM Plex Mono', monospace; font-weight: 500">6</b> running · Application is starting; Web waits for it</div>
      </div>
      <div style="padding: 0 24px 16px; display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{stages}}" as="s" hint-placeholder-count="3">
          <section style="border: 1px solid #E1E6EF; border-radius: 10px; overflow: hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; background: {{s.bg}}; font-size: 14px">
              <b style="font-weight: 600">{{s.order}} · {{s.name}}</b><span style="{{s.tagStyle}}">{{s.tag}}</span>
            </div>
            <sc-for list="{{s.vms}}" as="v" hint-placeholder-count="2">
              <div style="display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 14px; border-top: 1px solid #EEF1F5; font-size: 13.5px">
                <span style="{{v.pip}}"></span><span>{{v.name}}</span><span style="font-size: 13px; color: #5B6478">{{v.state}}</span>
              </div>
            </sc-for>
          </section>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 24px; background: #FAFBFD; border-top: 1px solid #E1E6EF">
        <a href="EnvDetail.dc.html" style="font-size: 14px; color: #A8331F; text-decoration: none">Cancel the rest</a>
        <a href="EnvDetail.dc.html" style="display: inline-flex; align-items: center; height: 38px; padding: 0 16px; border-radius: 8px; border: 1px solid #D4DAE5; color: #141B2D; text-decoration: none; font-weight: 500; font-size: 14px">Hide · keeps running</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const pip = (k) => 'display:inline-block;width:9px;height:16px;border-radius:2px;box-sizing:border-box;' +
      (k === 'R' ? 'background:#12915E;border:1px solid #0D7A4E' : k === 'B' ? 'background:#D9A21B;border:1px solid #B8860B;animation:pulse 1.1s ease-in-out infinite' : 'background:#FFFFFF;border:1px solid #B9C2D2');
    const tag = (k) => 'font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;' +
      (k === 'done' ? 'background:#E3F4EC;color:#0B6B44' : k === 'busy' ? 'background:#FBF3DC;color:#7A5000' : 'background:#ECEFF5;color:#4A5368');
    const stages = [
      { order: '1st', name: 'Database', tag: 'Done in 0:48', tagStyle: tag('done'), bg: '#F7FBF9', vms: [
        { name: 'crm-db-01', state: 'Running · 0:41', pip: pip('R') }, { name: 'crm-db-02', state: 'Running · 0:48', pip: pip('R') }] },
      { order: '2nd', name: 'Application', tag: 'Starting', tagStyle: tag('busy'), bg: '#FFFCF3', vms: [
        { name: 'crm-api-01', state: 'Running · 0:39', pip: pip('R') }, { name: 'crm-api-02', state: 'Starting · 0:54', pip: pip('B') }, { name: 'crm-api-03', state: 'Starting · 0:54', pip: pip('B') }] },
      { order: '3rd', name: 'Web', tag: 'Waits for Application', tagStyle: tag('wait'), bg: '#FAFBFD', vms: [
        { name: 'crm-web-01', state: 'Waiting', pip: pip('S') }] }
    ];
    return { stages };
  }
}
</script>
</body>
</html>
