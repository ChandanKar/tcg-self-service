<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F4A9E}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #141B2D; background: #F3F5F9; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 56px; flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #E1E6EF; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px">
    <img src="/_blob/f1f05675d2903e1819509cc3b2273e3c" alt="TCG Digital" style="height: 20px; width: auto">
    <span style="flex: 1"></span>
    <a href="Notifications.dc.html" aria-label="Notifications, 2 unread" style="position: relative; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #5B6478">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8a5 5 0 0 1 10 0c0 5 2 6 2 6H3s2-1 2-6M8.5 17a1.7 1.7 0 0 0 3 0"></path></svg>
      <span style="position: absolute; top: 8px; right: 8px; min-width: 16px; height: 16px; border-radius: 8px; background: #C2412D; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">2</span></a>
    <a href="MyAccount.dc.html" aria-label="Priya Nair, account" style="width: 34px; height: 34px; border-radius: 50%; background: #14245C; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">PN</a>
  </header>
  <main style="flex: 1; overflow: hidden; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <div>
      <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Home</h1>
      <p style="margin: 4px 0 0; font-size: 14px; color: #5B6478"><span style="font-family: 'IBM Plex Mono', monospace; color: #141B2D">8</span>/<span style="font-family: 'IBM Plex Mono', monospace; color: #141B2D">24</span> VMs running · <span style="font-family: 'IBM Plex Mono', monospace; color: #141B2D">$412.80</span> this month</p>
    </div>
    <a href="PhoneEnv.dc.html" style="display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; background: #FBF3DC; color: #5C3D00; text-decoration: none; font-size: 14px">
      <span style="width: 9px; height: 9px; border-radius: 50%; background: #D9A21B; flex-shrink: 0"></span><span style="flex: 1">Payments Dev stops at <span style="font-family: 'IBM Plex Mono', monospace">20:00</span></span><b style="font-weight: 600">Extend</b></a>
    <sc-for list="{{envs}}" as="e" hint-placeholder-count="3">
      <a href="{{e.href}}" style="display: flex; flex-direction: column; gap: 12px; background: #FFFFFF; border: 1px solid #E1E6EF; border-radius: 12px; padding: 16px; text-decoration: none; color: #141B2D">
        <div style="display: flex; justify-content: space-between; gap: 10px"><b style="font-size: 16px; font-weight: 600">{{e.name}}</b><span style="{{e.chipStyle}}">{{e.chip}}</span></div>
        <dc-import name="PowerStrip" states="{{e.states}}" large="{{ true }}" hint-size="240px,24px"></dc-import>
        <div style="font-size: 13px; color: #5B6478">{{e.line}}</div>
      </a>
    </sc-for>
  </main>
  <nav aria-label="Main" style="height: 64px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E1E6EF; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="PhoneHome.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #14245C; font-size: 11.5px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5 10 3.5l7 6V17H12v-5H8v5H3z"></path></svg>Home</a>
    <a href="Environments.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6478; font-size: 11.5px">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="14" height="5.5" rx="1.2"></rect><rect x="3" y="11.5" width="14" height="5.5" rx="1.2"></rect></svg>Environments</a>
    <a href="MyActivity.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6478; font-size: 11.5px">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7"></circle><path d="M10 6v4l2.5 1.5"></path></svg>Activity</a>
    <a href="PhoneMenu.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6478; font-size: 11.5px">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"></path></svg>More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = (k) => 'font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap;' +
      (k === 'run' ? 'background:#E3F4EC;color:#0B6B44' : k === 'busy' ? 'background:#FBF3DC;color:#7A5000' : 'background:#ECEFF5;color:#4A5368');
    const envs = [
      { name: 'Payments Dev', states: 'RRR|RR|SS', chip: 'Running', chipStyle: chip('run'), line: 'Web group stopped · stops at 20:00', href: 'PhoneEnv.dc.html' },
      { name: 'Analytics QA', states: 'RRB|RS', chip: 'Starting', chipStyle: chip('busy'), line: 'Locked by you until 14:30', href: 'PhoneEnv.dc.html' },
      { name: 'CRM UAT', states: 'SS|SSS|S', chip: 'Stopped', chipStyle: chip('stop'), line: 'Starts Mon 08:00', href: 'PhoneEnv.dc.html' }
    ];
    return { envs };
  }
}
</script>
</body>
</html>
