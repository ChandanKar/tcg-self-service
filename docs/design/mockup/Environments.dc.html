<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My environments</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F4A9E}a:hover{color:#14245C}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #141B2D; background: #F3F5F9; min-height: 900px; display: flex; flex-direction: column">
  <div style="position: sticky; top: 0; z-index: 20"><dc-import name="TopBar" role="user" hint-size="100%,56px"></dc-import></div>
  <div style="display: flex; flex-wrap: wrap; flex: 1">
    <div style="flex: 0 0 240px; position: sticky; top: 56px; align-self: flex-start; z-index: 10"><dc-import name="SideNav" role="user" active="environments" height="844px" hint-size="240px,844px"></dc-import></div>
    <main style="flex: 999 1 560px; min-width: 0; padding: 24px 32px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
        <div>
          <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Environments</h1>
          <p style="margin: 6px 0 0; font-size: 15px; color: #5B6478">The environments you can see. Open one to start, stop or lock it.</p>
        </div>
        <a href="Help.dc.html" style="font-size: 14px; text-decoration: none">How environments work</a>
      </div>

      <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center">
        <label style="flex: 1 1 280px; max-width: 420px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; background: #FFFFFF; border: 1px solid #D4DAE5; border-radius: 8px">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#5B6478" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"></circle><path d="m13.5 13.5 3.5 3.5"></path></svg>
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search environments</span>
          <input type="search" placeholder="Search by name" style="border: 0; outline: 0; font: inherit; font-size: 14px; flex: 1; background: transparent">
        </label>
        <div role="group" aria-label="Show" style="display: inline-flex; background: #FFFFFF; border: 1px solid #D4DAE5; border-radius: 8px; padding: 3px; gap: 2px">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
            <button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
          </sc-for>
        </div>
      </div>

      <div style="background: #FFFFFF; border: 1px solid #E1E6EF; border-radius: 12px; overflow: hidden">
        <table style="width: 100%; border-collapse: collapse; font-size: 14px">
          <thead>
            <tr style="background: #F7F8FB; color: #5B6478; font-size: 12.5px; text-align: left">
              <th scope="col" style="padding: 12px 20px; font-weight: 500">Environment</th>
              <th scope="col" style="padding: 12px; font-weight: 500">Type</th>
              <th scope="col" style="padding: 12px; font-weight: 500">Region</th>
              <th scope="col" style="padding: 12px; font-weight: 500">VMs</th>
              <th scope="col" style="padding: 12px; font-weight: 500">Lock</th>
              <th scope="col" style="padding: 12px; font-weight: 500">Your access</th>
              <th scope="col" style="padding: 12px; font-weight: 500; text-align: right">This month</th>
              <th scope="col" style="padding: 12px 20px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Open</span></th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
              <tr style="border-top: 1px solid #EEF1F5">
                <td style="padding: 14px 20px"><a href="{{r.href}}" style="color: #141B2D; text-decoration: none; font-weight: 600">{{r.name}}</a><div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5B6478; margin-top: 2px">{{r.slug}}</div></td>
                <td style="padding: 14px 12px; color: #3A4256">{{r.type}}</td>
                <td style="padding: 14px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #3A4256">{{r.region}}</td>
                <td style="padding: 14px 12px"><dc-import name="PowerStrip" states="{{r.states}}" hint-size="160px,20px"></dc-import></td>
                <td style="padding: 14px 12px; color: #3A4256">{{r.lock}}</td>
                <td style="padding: 14px 12px; color: #3A4256">{{r.access}}</td>
                <td style="padding: 14px 12px; text-align: right; font-family: 'IBM Plex Mono', monospace">{{r.cost}}</td>
                <td style="padding: 14px 20px; text-align: right"><a href="{{r.href}}" style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border: 1px solid #B9C2DA; border-radius: 7px; color: #14245C; text-decoration: none; font-weight: 500; font-size: 13px">Open</a></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
        <div style="padding: 12px 20px; border-top: 1px solid #EEF1F5; font-size: 13px; color: #5B6478">4 environments</div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'all' }; }
  renderVals() {
    const all = [
      { name: 'Payments Dev', slug: 'payments-dev', type: 'AWS EC2', region: 'ap-south-1', states: 'RRR|RR|SS', lock: 'Not locked', access: 'Operator', cost: '$186.40', href: 'EnvDetail.dc.html', run: true },
      { name: 'Analytics QA', slug: 'analytics-qa', type: 'AWS EC2', region: 'ap-south-1', states: 'RRB|RS', lock: 'Locked by you', access: 'Operator', cost: '$121.75', href: 'EnvDetail.dc.html', run: true },
      { name: 'CRM UAT', slug: 'crm-uat', type: 'AWS EC2', region: 'us-east-1', states: 'SS|SSS|S', lock: 'Not locked', access: 'Operator', cost: '$64.10', href: 'EnvDetail.dc.html', run: false },
      { name: 'HR Portal Staging', slug: 'hr-portal-stg', type: 'AWS EKS', region: 'ap-south-1', states: 'SSSS|SS', lock: 'Rahul Verma', access: 'View only', cost: '$40.55', href: 'EnvDetailViewer.dc.html', run: false }
    ];
    const f = this.state.filter;
    const rows = all.filter(r => f === 'all' || (f === 'run' ? r.run : !r.run));
    const filters = [['all', 'All'], ['run', 'Running'], ['stop', 'Stopped']].map(([k, label]) => ({
      label, pressed: String(f === k),
      pick: () => this.setState({ filter: k }),
      style: 'border:0;font:inherit;font-size:13px;padding:6px 12px;border-radius:6px;cursor:pointer;' +
        (f === k ? 'background:#14245C;color:#FFFFFF;font-weight:500' : 'background:transparent;color:#3A4256')
    }));
    return { rows, filters };
  }
}
</script>
</body>
</html>
