name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Front-end helper tests (node:test, no npm dependencies).
      - name: JavaScript unit tests
        run: node --test "src/test/js/**/*.test.mjs"

      # Docker is available on GitHub-hosted runners, so integration tests use Testcontainers MySQL.
      - name: Build and test
        run: ./gradlew build --no-daemon

      # The JAR serves the bundled frontend (E14-T02).
      - name: Check the packaged frontend bundle
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -1)
          jar tf "$JAR" | grep -q 'BOOT-INF/classes/static/dist/app.js'
          jar tf "$JAR" | grep -q 'BOOT-INF/classes/static/dist/app.css'
          unzip -p "$JAR" BOOT-INF/classes/static/index.html | grep -q 'dist/app.js'
          unzip -p "$JAR" BOOT-INF/classes/static/index.html | grep -q 'dist/app.css'
          ! unzip -p "$JAR" BOOT-INF/classes/static/index.html | grep -q 'js/core/router.js'
          # Dead assets stay out (E14-T03)
          ! jar tf "$JAR" | grep -q -e 'static/templates/' -e 'static/old_backup/' -e 'template-loader.js'

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests
