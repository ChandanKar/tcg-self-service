# Alias of application.properties — used when @ActiveProfiles("test") is set.
# Database: a local MySQL test schema when TEST_DB_URL is set (no Docker needed; the build
# loads TEST_DB_* from .env and refuses any schema not ending in _test), otherwise a
# Testcontainers MySQL 8.0 container (requires Docker, used in CI).
spring.datasource.url=${TEST_DB_URL:jdbc:tc:mysql:8.0:///db_test}
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:root}

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

entraid.enabled=false

logging.level.com.tcgdigital.vmcontrol=DEBUG
logging.level.org.springframework.transaction=DEBUG

# --- No scheduled jobs, no cloud calls, no mail in tests ---
app.scheduling.enabled=false
vm.state.sync.enabled=false
vm.inventory.sync.enabled=false
cloudwatch.metric.enable=false
cloudwatch.metric.rollup.enable=false
vm.metrics.archive.enabled=false
cost.snapshot.enabled=false
automation.rules.enabled=false
eks.sync.status-refresh.enabled=false
vm.discovery.enabled=false
cost.tagging.enabled=false
cost.actuals.enabled=false
cost.reservations.enabled=false
notification.weekly-reports.enabled=false
notification.email.enabled=false
graph.directory.enabled=false

# A mail sender bean must exist for EmailService; nothing is sent (notification.email.enabled=false).
spring.mail.host=localhost
spring.mail.port=2525
