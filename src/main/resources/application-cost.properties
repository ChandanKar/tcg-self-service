# 'cost' profile (E08-T10): the cost features that change AWS or send mail, opt-in.
# Activate with SPRING_PROFILES_ACTIVE=prod,cost.
#
# The read-only cost features (actuals, Compute Optimizer, RI/SP coverage, weekly bell reports)
# are already on by default in application.properties. This profile adds:
#   - cost-allocation tagging, which WRITES tcg:managed-by/environment/team tags to EC2 instances
#     and EKS node groups and activates them in Cost Explorer;
#   - the weekly report emails. These also need notification.email.enabled=true and SMTP
#     (spring.mail.*) configured, or nothing is sent.
# See docs/cost-management-setup.md.

cost.tagging.enabled=true

notification.email.weekly-cost-report.enabled=true
notification.email.weekly-idle-waste-report.enabled=true
notification.email.weekly-rightsizing-report.enabled=true
