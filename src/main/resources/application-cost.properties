# 'cost' profile (E08-T10): the cost features that change AWS or send mail, opt-in.
# Activate with SPRING_PROFILES_ACTIVE=prod,cost.
#
# Compute Optimizer and the weekly bell reports are on by default in application.properties.
# The features that call AWS Cost Explorer (billed, and they need the ce:* IAM permissions in
# docs/aws-iam-permissions.md) are off by default since U21-T05; this profile turns them on:
# actual costs, RI/SP coverage, the AWS cost forecast and commitment recommendations. It also adds:
#   - cost-allocation tagging, which WRITES tcg:managed-by/environment/team tags to EC2 instances
#     and EKS node groups and activates them in Cost Explorer;
#   - the weekly report emails. These also need notification.email.enabled=true and SMTP
#     (spring.mail.*) configured, or nothing is sent.
# See docs/cost-management-setup.md.

# Cost Explorer reads (U21-T05)
cost.actuals.enabled=true
cost.reservations.enabled=true
cost.aws-forecast.enabled=true
cost.commitments.recommendations.enabled=true

cost.tagging.enabled=true

# Cost anomalies (E21): ingest AWS Cost Anomaly Detection anomalies twice a day.
cost.anomalies.enabled=true

notification.email.weekly-cost-report.enabled=true
notification.email.weekly-idle-waste-report.enabled=true
notification.email.weekly-rightsizing-report.enabled=true
