<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VM Self-Service Platform</title>

    <!-- Bootstrap CSS -->
    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">

    <!-- Application CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="login-logo">
                <img src="logo/tcg_blue_logo.png" alt="TCG Digital - VM Self-Service Platform" class="logo-img">
            </div>

            <!-- Title -->
            <h1 class="login-title">VM Self-Service Platform</h1>
            <p class="login-subtitle">Sign in to manage your virtual machines</p>

            <!-- Error Message Display -->
            <div id="errorAlert" class="alert alert-danger d-none" role="alert">
                <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                <span id="errorMessage"></span>
            </div>

            <!-- Login Form -->
            <form class="login-form" id="loginForm">
                <div class="form-group mb-2">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="Enter your username" required
                           autocomplete="username">
                </div>

                <div class="form-group mb-2">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Enter your password" required
                           autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-login" id="submitBtn">
                    <i class="fas fa-sign-in-alt" aria-hidden="true"></i> Sign In
                </button>
            </form>

            <!-- Divider -->
            <div class="login-divider" id="loginDivider">
                <span>OR</span>
            </div>

            <!-- Entra ID Login Button -->
            <div class="entraid-login">
                <a href="/oauth2/authorization/azure" class="btn btn-entraid">
                    <i class="fab fa-microsoft"></i> Sign in with Entra ID
                </a>
            </div>

            <!-- Logout Success Message -->
            <div id="logoutMessage" class="alert alert-success d-none" role="status">
                <i class="fas fa-check-circle"></i> You have been successfully logged out.
            </div>

            <!-- Footer -->
            <div class="login-footer">
                <p class="text-muted">
                    <small>Powered by TCG Digital &copy; 2026</small>
                </p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Login page behaviour (no inline script so a strict CSP can apply) -->
    <script src="js/login.js?v=202610081000"></script>
</body>
</html>
