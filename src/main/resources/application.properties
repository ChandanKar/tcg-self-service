spring.application.name=vmcontrol

# Master switch for every @Scheduled job (see config/SchedulingConfig). Default on.
app.scheduling.enabled=${APP_SCHEDULING_ENABLED:true}

#spring.data.redis.host=localhost
#spring.data.redis.port=6379
#app.redis.embedded.enabled=false

# =============================================================================
# Database configuration — MySQL (local dev and production)
# Values loaded from .env file (no hard-coded defaults for credentials)
# =============================================================================
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.MySQL8Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
# Batches saveAll() calls into grouped JDBC statements instead of one round-trip per entity —
# needed by VmMetricRollupService's per-date saveAll() to keep the rollup job's connection-hold
# time short (see VmMetricRollupService for the full N+1 story this fixes).
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway configuration
spring.flyway.clean-on-validation-error=${FLYWAY_CLEAN_ON_VALIDATION_ERROR:false}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.out-of-order=${FLYWAY_OUT_OF_ORDER:false}
# Fail startup when an applied migration was edited; never repair automatically (E14-T01).
# See docs/runbook-flyway.md for a deliberate, manual repair.
spring.flyway.validate-on-migrate=true

# =============================================================================
# Entra ID (Azure AD) OAuth2 Authentication
# =============================================================================
# Set entraid.enabled=true to enable authentication via Microsoft Entra ID.
# When disabled (false), all requests are permitted.
entraid.enabled=${ENTRAID_ENABLED:true}

# Who an ENV_ADMIN administers (grants, environment settings): 'global' = every environment
# (today's documented behaviour, docs/access-grants-requirement.md section 5); 'assigned' = only
# environments where they hold an active ENVIRONMENT-scope ADMIN grant (matches
# EnvironmentAccessService.getAdministeredEnvironmentIds). Global ADMINs administer everything.
security.env-admin.scope=${SECURITY_ENV_ADMIN_SCOPE:global}

# Session lifetime: idle timeout (servlet) and an absolute cap after sign-in, enforced per
# request by CurrentUserRefreshFilter (background polls keep a session from going idle).
server.servlet.session.timeout=${SESSION_IDLE_TIMEOUT:60m}
security.session.absolute-timeout=${SECURITY_SESSION_ABSOLUTE_TIMEOUT:PT12H}

# Content-Security-Policy (security/SecurityHeaders). true = Report-Only: violations are posted
# to /api/csp-report and logged at WARN, nothing is blocked. Set false to enforce once the
# logs stay clean after a normal day of use.
security.csp.report-only=${SECURITY_CSP_REPORT_ONLY:true}

# Username/password sign-in (POST /api/auth/login), alongside Entra ID.
# Only bcrypt hashes authenticate; set false to serve 404 on the endpoint.
auth.password-login.enabled=${AUTH_PASSWORD_LOGIN_ENABLED:true}
# Failed password logins allowed per username / per client IP within the window, then 429.
auth.login.max-failures-per-user=${AUTH_LOGIN_MAX_FAILURES_PER_USER:5}
auth.login.max-failures-per-ip=${AUTH_LOGIN_MAX_FAILURES_PER_IP:20}
auth.login.window-minutes=${AUTH_LOGIN_WINDOW_MINUTES:15}

# Azure OAuth2 Configuration (values from .env - no defaults for secrets)
spring.security.oauth2.client.registration.azure.provider=azure
spring.security.oauth2.client.registration.azure.client-id=${AZURE_CLIENT_ID}
spring.security.oauth2.client.registration.azure.client-secret=${AZURE_CLIENT_SECRET}
spring.security.oauth2.client.registration.azure.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.azure.scope[0]=openid
spring.security.oauth2.client.registration.azure.scope[1]=profile
spring.security.oauth2.client.registration.azure.scope[2]=email
spring.security.oauth2.client.registration.azure.scope[3]=offline_access
spring.security.oauth2.client.registration.azure.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.azure.authorization-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.azure.token-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token
spring.security.oauth2.client.provider.azure.jwk-set-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID}/discovery/v2.0/keys
spring.security.oauth2.client.provider.azure.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.azure.user-name-attribute=name
# Logout also ends the Entra session (EntraLogoutSuccessHandler). Entra returns the browser to
# entraid.post-logout-redirect-uri (blank: <this server>/login?logout=true), which must be listed
# under the app registration's redirect URIs.
entraid.end-session-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/logout
entraid.post-logout-redirect-uri=${ENTRAID_POST_LOGOUT_REDIRECT_URI:}

# Microsoft Graph directory lookup (client-credentials) — powers admin user onboarding.
# Requires the Azure app registration to hold the *application* permission
# User.ReadBasic.All with tenant admin consent. Off by default; when off, onboarding
# falls back to manual entry (see docs/graph-user-onboarding.md).
spring.security.oauth2.client.registration.graph.provider=graph
spring.security.oauth2.client.registration.graph.client-id=${AZURE_CLIENT_ID}
spring.security.oauth2.client.registration.graph.client-secret=${AZURE_CLIENT_SECRET}
spring.security.oauth2.client.registration.graph.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.graph.scope=https://graph.microsoft.com/.default
spring.security.oauth2.client.provider.graph.token-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token

graph.directory.enabled=${GRAPH_DIRECTORY_ENABLED:false}
graph.api.base-url=${GRAPH_API_BASE_URL:https://graph.microsoft.com/v1.0}
graph.api.timeout-ms=${GRAPH_API_TIMEOUT_MS:5000}

# =============================================================================
# AWS Configuration (values from .env - no defaults for secrets)
# =============================================================================
aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_SECRET_KEY:}
# E28-T01: with no keys, use the SDK default credential chain (EC2/ECS instance role, IRSA, profile).
aws.credentials.use-default-chain=${AWS_USE_DEFAULT_CREDENTIAL_CHAIN:false}
# E28-T03: fill the default account's number from STS GetCallerIdentity once the app is ready.
aws.accounts.resolve-default-number=${AWS_ACCOUNTS_RESOLVE_DEFAULT_NUMBER:true}
# E28-T04: reach member accounts by assuming their role (off: every account uses the base credentials).
aws.multi-account.enabled=${AWS_MULTI_ACCOUNT_ENABLED:false}
aws.assume-role.session-duration-seconds=${AWS_ASSUME_ROLE_SESSION_DURATION_SECONDS:3600}
aws.assume-role.session-name-prefix=${AWS_ASSUME_ROLE_SESSION_NAME_PREFIX:vmcontrol}
# E28-T08: list member accounts from AWS Organizations (billing account = management or delegated admin).
aws.organizations.enabled=${AWS_ORGANIZATIONS_ENABLED:false}
aws.organizations.member-role-name=${AWS_ORGANIZATIONS_MEMBER_ROLE_NAME:VmControlAccess}
aws.region=${AWS_REGION:ap-south-1}

# EC2 start: how long to wait for an instance to reach RUNNING and pass every AWS status
# check (system + instance + attached-EBS) before the start step is reported failed. Those
# checks routinely take 2-5+ min after boot, so 5 min was too tight and flagged healthy VMs
# as failures. Keep below vm.state.sync.stale-transitional-minutes (20m) so a genuinely
# stuck transitional VM is still eventually reconciled.
aws.status-check.timeout-ms=${AWS_STATUS_CHECK_TIMEOUT_MS:900000}
aws.status-check.poll-interval-ms=${AWS_STATUS_CHECK_POLL_INTERVAL_MS:10000}

# VM start/stop steps (and their AWS status-check polling) running at once across all
# operations, and at most per operation (M10: one big run must not hold every thread).
# VMs with dependencies still wait their turn. EKS node-group calls have their own pool.
vm.operations.parallelism=${VM_OPERATIONS_PARALLELISM:20}
vm.operations.per-execution-parallelism=${VM_OPERATIONS_PER_EXECUTION_PARALLELISM:5}
eks.operations.parallelism=${EKS_OPERATIONS_PARALLELISM:10}

# =============================================================================
# VM State Sync Configuration
# =============================================================================
# Enable/disable automatic VM state synchronization
vm.state.sync.enabled=${VM_STATE_SYNC_ENABLED:true}
# Sync interval in milliseconds (default: 5 minutes = 300000)
vm.state.sync.interval=${VM_STATE_SYNC_INTERVAL:300000}
# Initial delay before first sync in milliseconds (default: 1 minute = 60000)
vm.state.sync.initial-delay=${VM_STATE_SYNC_INITIAL_DELAY:60000}
# A VM in STARTING/STOPPING longer than this is treated as orphaned (not a real in-flight
# operation) and reconciled against actual cloud state instead of being skipped forever.
# Must stay above the longest single-VM operation timeout (EKS node group scaling: 15 min).
vm.state.sync.stale-transitional-minutes=${VM_STATE_SYNC_STALE_TRANSITIONAL_MINUTES:20}
# Consecutive NOT_FOUND results before state sync deactivates a VM (one miss, e.g. after a wrong
# region edit, only flags drift). TERMINATED still deactivates at once. Inactive VMs can be
# reactivated from the registry (POST .../vms/{vmId}/reactivate) or by discovery finding them.
vm.state.sync.not-found-threshold=${VM_STATE_SYNC_NOT_FOUND_THRESHOLD:3}

# =============================================================================
# EKS Sync Configuration
# =============================================================================
# Auto-register newly discovered EKS clusters as Environments (off by default — this creates
# new Environment rows with no human review; use the "Create Environment > EKS" picker instead)
eks.sync.auto-register.enabled=${EKS_SYNC_AUTO_REGISTER_ENABLED:false}
# Periodically refresh node-group status/drift for EKS environments already registered (on by
# default — safe, non-destructive, independent of auto-register above)
eks.sync.status-refresh.enabled=${EKS_SYNC_STATUS_REFRESH_ENABLED:true}
# Comma-separated AWS regions to scan for auto-discovery of new EKS clusters (falls back to aws.region if unset)
eks.sync.regions=${EKS_SYNC_REGIONS:}
# Sync interval in milliseconds (default: 5 minutes)
eks.sync.interval=${EKS_SYNC_INTERVAL:300000}
# Initial delay before first EKS sync in milliseconds (default: 1 minute)
eks.sync.initial-delay=${EKS_SYNC_INITIAL_DELAY:60000}
# Minimum node count to restore when starting a stopped node group (fallback when no saved metadata)
eks.nodegroup.default-min-size=${EKS_DEFAULT_MIN_SIZE:1}
# Poll interval during scale-up/down wait loop in milliseconds
eks.nodegroup.poll-interval-ms=${EKS_POLL_INTERVAL_MS:15000}
# Max time to wait for a scale operation to complete in milliseconds (default: 15 minutes)
eks.nodegroup.operation-timeout-ms=${EKS_OP_TIMEOUT_MS:900000}

# RDS DB instances and Aurora clusters as VMs (E33-T01): provider AWS_RDS, providerVmId db:<instance>
# or cluster:<cluster>. Off: they cannot be operated and nothing reaches RDS. Needs rds:StartDBInstance,
# StopDBInstance, StartDBCluster, StopDBCluster and Describe* (docs/aws-iam-permissions.md).
rds.enabled=${RDS_ENABLED:false}
rds.poll-interval-ms=${RDS_POLL_INTERVAL_MS:20000}
rds.operation-timeout-ms=${RDS_OP_TIMEOUT_MS:1800000}
rds.operations.parallelism=${RDS_OPERATIONS_PARALLELISM:10}

# =============================================================================
# VM Auto-Discovery Configuration
# =============================================================================
# Enable tag-based EC2 discovery (opt-in; requires tcg:environment tag on instances)
vm.discovery.enabled=${VM_DISCOVERY_ENABLED:false}
# Discovery interval in milliseconds (default: 10 minutes)
vm.discovery.interval=${VM_DISCOVERY_INTERVAL:600000}
# Initial delay before first discovery run (default: 2 minutes)
vm.discovery.initial-delay=${VM_DISCOVERY_INITIAL_DELAY:120000}
# Discovery strategy: "tag" (match by tag key=env-name) or "name-pattern" (parse Name tag like tcg-backend-1)
vm.discovery.strategy=${VM_DISCOVERY_STRATEGY:tag}
# AWS tag key used to match instances to environments (strategy=tag only)
vm.discovery.tag.environment-key=${VM_DISCOVERY_TAG_ENV_KEY:tcg:environment}
# Name prefix filter for name-pattern strategy — only instances whose Name starts with this are considered.
# Required for name-pattern: with an empty prefix the strategy does nothing.
vm.discovery.name-pattern.prefix=${VM_DISCOVERY_NAME_PREFIX:}
# Environments created by name-pattern discovery start inactive until an admin reactivates them;
# true restores the old behaviour (created active, VMs registered at once).
vm.discovery.name-pattern.auto-activate-environments=${VM_DISCOVERY_AUTO_ACTIVATE_ENVIRONMENTS:false}

# =============================================================================
# VM Inventory and Utilization Metrics Configuration
# =============================================================================
vm.inventory.sync.enabled=${VM_INVENTORY_SYNC_ENABLED:true}
vm.inventory.sync.interval=${VM_INVENTORY_SYNC_INTERVAL:3600000}
vm.inventory.sync.initial-delay=${VM_INVENTORY_SYNC_INITIAL_DELAY:60000}

# Master switch for CloudWatch VM metric collection (vm_metric_sample sync, every N minutes).
# Turning this off also starves the daily rollup below of new data, but does not disable it —
# set cloudwatch.metric.rollup.enable=false separately if you want to stop that too.
cloudwatch.metric.enable=${CLOUDWATCH_METRIC_ENABLE:true}
# Interval in MINUTES (not ms) between CloudWatch GetMetricData sync cycles.
cloudwatch.metric.schedule.interval=${CLOUDWATCH_METRIC_SCHEDULE_INTERVAL:5}
cloudwatch.metric.schedule.initial-delay=${CLOUDWATCH_METRIC_SCHEDULE_INITIAL_DELAY:2}
vm.metrics.period-seconds=${VM_METRICS_PERIOD_SECONDS:300}
# A sync fills gaps since each VM's latest stored sample, at most this many hours back (E12-T03).
vm.metrics.backfill-max-hours=${VM_METRICS_BACKFILL_MAX_HOURS:3}

# Rolls raw vm_metric_sample rows up into one vm_metric_daily row per VM per day — this is what
# Cost Management's rightsizing recommendations actually read. Re-aggregates the same lookback
# window (vm.metrics.archive.raw-to-archive-days) on every run: cheap (idempotent upsert), keeps
# today's partial-day row fresh, and doubles as a one-time backfill the first time it runs
# against a database that already has un-rolled-up history.
cloudwatch.metric.rollup.enable=${CLOUDWATCH_METRIC_ROLLUP_ENABLE:true}
# Interval in MINUTES between rollup runs — defaults to hourly, not every 5 minutes like the raw
# sync, since a same-day row only needs to stay reasonably fresh, not real-time.
cloudwatch.metric.rollup.schedule.interval=${CLOUDWATCH_METRIC_ROLLUP_SCHEDULE_INTERVAL:60}
cloudwatch.metric.rollup.schedule.initial-delay=${CLOUDWATCH_METRIC_ROLLUP_SCHEDULE_INITIAL_DELAY:3}

vm.metrics.idle.cpu-threshold-percent=${VM_IDLE_CPU_THRESHOLD_PERCENT:5}
vm.metrics.idle.network-threshold-bytes-per-period=${VM_IDLE_NETWORK_THRESHOLD_BYTES_PER_PERIOD:1048576}
vm.metrics.idle.disk-threshold-bytes-per-period=${VM_IDLE_DISK_THRESHOLD_BYTES_PER_PERIOD:1048576}
vm.metrics.idle.minimum-duration-minutes=${VM_IDLE_MINIMUM_DURATION_MINUTES:30}

vm.metrics.archive.enabled=${VM_METRICS_ARCHIVE_ENABLED:true}
vm.metrics.archive.raw-to-archive-days=${VM_METRICS_ARCHIVE_RAW_TO_ARCHIVE_DAYS:30}
vm.metrics.archive.batch-size=${VM_METRICS_ARCHIVE_BATCH_SIZE:10000}
# Each run moves batches until the backlog is done or this many batches ran (E12-T01).
vm.metrics.archive.max-batches-per-run=${VM_METRICS_ARCHIVE_MAX_BATCHES_PER_RUN:200}
# Archive rows older than this many days are deleted; 0 keeps them forever (E12-T01).
vm.metrics.archive.retention-days=${VM_METRICS_ARCHIVE_RETENTION_DAYS:365}
vm.metrics.archive.cron=${VM_METRICS_ARCHIVE_CRON:0 30 2 * * *}

scheduler.lock.default-ttl-ms=${SCHEDULER_LOCK_DEFAULT_TTL_MS:900000}

# =============================================================================
# Cost Management Configuration
# =============================================================================
cost.provider=${COST_PROVIDER:estimated}
cost.snapshot.enabled=${COST_SNAPSHOT_ENABLED:true}
cost.snapshot.cron=${COST_SNAPSHOT_CRON:0 0 3 * * *}
# Cost days are whole days in this zone; UTC matches Cost Explorer (E08-T01).
cost.day-boundary-zone=${COST_DAY_BOUNDARY_ZONE:UTC}
# The cost page's per-VM bundles are reused for this long across its burst of requests (E08-T04).
cost.bundle-cache-seconds=${COST_BUNDLE_CACHE_SECONDS:60}
# Compute Optimizer recommendations are captured daily and stored (E30-T04); the rightsizing page
# reads the stored rows. Rows no capture refreshed for retention-days are dropped.
cost.optimizer.cron=${COST_OPTIMIZER_CRON:0 45 5 * * *}
cost.optimizer.retention-days=${COST_OPTIMIZER_RETENTION_DAYS:7}
# After an instance-type change, ignore Compute Optimizer for this many days (it needs ~14 days
# of data on the new size); daily CPU rows from before the change are always ignored (E08-T06).
rightsizing.post-resize-cooldown-days=${RIGHTSIZING_POST_RESIZE_COOLDOWN_DAYS:14}
# Each snapshot run (re)captures the last N complete days, ending yesterday, to pick up late
# state changes. Today is never captured.
cost.snapshot.recompute-days=${COST_SNAPSHOT_RECOMPUTE_DAYS:3}

# Cost-allocation tagging (Cost Management Phase 1) — writes tcg:managed-by/environment/team
# tags to real AWS EC2 instances and EKS node groups. Disabled by default: this is a bigger
# blast radius than the rest of Cost Management, which is entirely read-only.
cost.tagging.enabled=${COST_TAGGING_ENABLED:false}
cost.tagging.key-prefix=${COST_TAGGING_KEY_PREFIX:tcg:}
cost.tagging.cron=${COST_TAGGING_CRON:0 30 2 * * *}
# Minutes to wait after a failed Cost Explorer tag activation before retrying (E08-T02).
cost.tagging.activation-retry-minutes=${COST_TAGGING_ACTIVATION_RETRY_MINUTES:360}

# Real billing ingestion (Cost Management Phase 2). Enabled by default (E08-T10): read-only,
# skipped without AWS credentials, one billed GetCostAndUsage call a day (~$0.01). Environments
# resolve only once the tcg: cost-allocation tags are active in Cost Explorer (up to 24h).
# Without ce:GetCostAndUsage the daily run just logs the denial; set false to silence it.
cost.actuals.enabled=${COST_ACTUALS_ENABLED:true}
cost.actuals.cron=${COST_ACTUALS_CRON:0 0 5 * * *}
# Each run re-ingests this many complete days: Cost Explorer figures stay provisional ~72h (E08-T02).
cost.actuals.trailing-days=${COST_ACTUALS_TRAILING_DAYS:3}

# AWS-native optimization signals (Cost Management Phase 3). Enabled by default (E08-T10): both
# are read-only and skipped without AWS credentials. Compute Optimizer calls are free (captured
# once a day, E30-T04); RI/Savings Plan coverage makes 4 billed Cost Explorer calls a day.
cost.optimizer.enabled=${COST_OPTIMIZER_ENABLED:true}
cost.reservations.enabled=${COST_RESERVATIONS_ENABLED:true}
cost.reservations.cron=${COST_RESERVATIONS_CRON:0 15 5 * * *}
# E27-T01: AWS Savings Plan / RI purchase recommendations, captured on Mondays with the coverage
# snapshot (3 billed calls a week, read-only). Term ONE_YEAR|THREE_YEARS; payment NO_UPFRONT|
# PARTIAL_UPFRONT|ALL_UPFRONT; lookback SEVEN_DAYS|THIRTY_DAYS|SIXTY_DAYS.
cost.commitments.recommendations.enabled=${COST_COMMITMENTS_RECOMMENDATIONS_ENABLED:true}
cost.commitments.term=${COST_COMMITMENTS_TERM:ONE_YEAR}
cost.commitments.payment-option=${COST_COMMITMENTS_PAYMENT_OPTION:NO_UPFRONT}
cost.commitments.lookback=${COST_COMMITMENTS_LOOKBACK:THIRTY_DAYS}

# Bidirectional CPU-based rightsizing thresholds. Scale-down: flagged when avg CPU stays below
# the threshold for this many consecutive days. Scale-up: flagged when CPU stays above the
# threshold for this many consecutive minutes (raw 5-minute CloudWatch samples).
rightsizing.scale-down.cpu-threshold=${RIGHTSIZING_SCALE_DOWN_CPU_THRESHOLD:15}
rightsizing.scale-down.consecutive-days=${RIGHTSIZING_SCALE_DOWN_CONSECUTIVE_DAYS:3}
rightsizing.scale-up.cpu-threshold=${RIGHTSIZING_SCALE_UP_CPU_THRESHOLD:70}
rightsizing.scale-up.consecutive-minutes=${RIGHTSIZING_SCALE_UP_CONSECUTIVE_MINUTES:15}
# Memory-aware rightsizing (E30-T03; needs the CloudWatch agent's mem_used_percent). A scale-down
# also needs every recent day's memory peak below the peak threshold; memory above the scale-up
# threshold in every sample of the scale-up window makes a VM a scale-up candidate; a smaller
# type must hold the observed memory peak plus the headroom. false = the CPU-only rules.
rightsizing.memory.enabled=${RIGHTSIZING_MEMORY_ENABLED:true}
rightsizing.scale-down.memory-peak-threshold=${RIGHTSIZING_SCALE_DOWN_MEMORY_PEAK_THRESHOLD:60}
rightsizing.scale-up.memory-threshold=${RIGHTSIZING_SCALE_UP_MEMORY_THRESHOLD:85}
rightsizing.memory.headroom-percent=${RIGHTSIZING_MEMORY_HEADROOM_PERCENT:20}
# Safe resize (E30-T06): Apply may stop a running VM, change its type, start it again and roll back
# to the old type when the new one will not start. Changes AWS state; pilot on non-production first.
rightsizing.safe-resize.enabled=${RIGHTSIZING_SAFE_RESIZE_ENABLED:false}

# Spot (E31). Spot prices are captured daily (read-only, ec2:DescribeSpotPriceHistory) and Spot VMs
# are priced at them; off until turned on.
spot.pricing.enabled=${SPOT_PRICING_ENABLED:false}
# Environments may opt in to Spot (E31-T03); nothing about Spot can be changed while this is off.
spot.enabled=${SPOT_ENABLED:false}
# Converting an EKS node group to a Spot twin (E31-T05) creates and deletes node groups; the twin
# gets at least this many same-size instance types to draw Spot capacity from.
spot.eks.conversion.enabled=${SPOT_EKS_CONVERSION_ENABLED:false}
spot.eks.min-instance-types=${SPOT_EKS_MIN_INSTANCE_TYPES:3}
# When a Spot twin is short of capacity for grace-minutes, its on-demand standby is started; it is
# scaled back to 0 after two healthy checks (E31-T06).
spot.fallback.enabled=${SPOT_FALLBACK_ENABLED:false}
spot.fallback.grace-minutes=${SPOT_FALLBACK_GRACE_MINUTES:10}
spot.fallback.cron=${SPOT_FALLBACK_CRON:0 */5 * * * *}

# Self-service provisioning from approved templates (E32). Off: the template catalogue and requests
# are not reachable (404).
provisioning.enabled=${PROVISIONING_ENABLED:false}
# Approved requests are started and polled every minute; a build longer than this fails (E32-T04).
provisioning.cron=${PROVISIONING_CRON:0 * * * * *}
provisioning.timeout-minutes=${PROVISIONING_TIMEOUT_MINUTES:60}
# Destroy provisioned environments when their lifetime ends (E32-T05). Deletes AWS resources; warnings
# a day and an hour before are sent either way. A manual destroy needs an explicit confirmation.
provisioning.destroy.enabled=${PROVISIONING_DESTROY_ENABLED:false}
# Terraform templates run in HCP Terraform / Terraform Enterprise (E32-T06); the token is a team or
# organization API token. delete-workspace removes a workspace after its destroy run is applied.
provisioning.terraform.enabled=${PROVISIONING_TERRAFORM_ENABLED:false}
provisioning.terraform.base-url=${TFC_BASE_URL:https://app.terraform.io}
provisioning.terraform.token=${TFC_TOKEN:}
provisioning.terraform.organization=${TFC_ORGANIZATION:}
provisioning.terraform.delete-workspace=${TFC_DELETE_WORKSPACE:false}
spot.pricing.cron=${SPOT_PRICING_CRON:0 20 4 * * *}

# =============================================================================
# Lock expiry (E07-T02): a lock taken for a duration is released automatically when it runs
# out ("until manually released" locks never are). Off by default; enable together with the lock
# countdown UI (E07-T05).
locks.expiry.enabled=${LOCKS_EXPIRY_ENABLED:false}
locks.expiry.interval-ms=${LOCKS_EXPIRY_INTERVAL_MS:60000}
locks.max-duration-minutes=${LOCKS_MAX_DURATION_MINUTES:1440}
# Minutes before expiry at which the holder is warned (comma-separated); extending re-arms them.
locks.expiry.warning-minutes=${LOCKS_EXPIRY_WARNING_MINUTES:15,5}

# Automation Rules — calendar-schedule and access-grant/lock-acquire auto start/stop
# =============================================================================
automation.rules.enabled=${AUTOMATION_RULES_ENABLED:true}
# Evaluation interval in milliseconds (default: 1 minute = 60000) — matched to the "HH:mm"
# granularity of schedule rules, so sub-minute tick offset doesn't matter.
automation.rules.interval=${AUTOMATION_RULES_INTERVAL:60000}
automation.rules.initial-delay=${AUTOMATION_RULES_INITIAL_DELAY:60000}

# =============================================================================
# Actuator — expose only /actuator/health; lock down everything else
# =============================================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
# Mail is an opt-in feature (notification.email.enabled, off by default) with no SMTP
# configured out of the box — app health must not depend on it being reachable.
management.health.mail.enabled=false

# =============================================================================
# User Management Configuration
# =============================================================================
# Email of user to auto-promote to admin on first OAuth2 login
# This is useful for bootstrapping the first admin user
app.initial-admin-email=${APP_INITIAL_ADMIN_EMAIL:}

# =============================================================================
# Access Grants
# =============================================================================
# When false, access can only be granted at the environment level — the /access-grants
# endpoint rejects GROUP scope (404) and operation authorization stays environment-wide.
# Exactly the pre-group-access behaviour.
access.group-scope.enabled=${ACCESS_GROUP_SCOPE_ENABLED:true}
# Longest access a requester may ask for, and the longest an admin may grant or approve (days).
access.request.max-duration-days=${ACCESS_REQUEST_MAX_DURATION_DAYS:180}
access.grant.max-duration-days=${ACCESS_GRANT_MAX_DURATION_DAYS:365}

# An operation with no progress for this long is failed (restart/orphan recovery, H12).
# Keep it longer than the slowest provider wait (15 min status checks).
vm.operations.stale-after-minutes=${VM_OPERATIONS_STALE_AFTER_MINUTES:30}
vm.operations.recovery.enabled=${VM_OPERATIONS_RECOVERY_ENABLED:true}

# A schedule rule time still fires on a scheduler tick up to this many minutes late (H26).
automation.rules.catch-up-minutes=${AUTOMATION_RULES_CATCH_UP_MINUTES:15}

# Idle auto-stop (E16). Ships dark: rules can be configured, but nothing is evaluated until enabled.
# Roll out by enabling with every rule in DRY_RUN; ENFORCE is allowed after min-dry-run-days
# (an ADMIN can override).
automation.idle-stop.enabled=${AUTOMATION_IDLE_STOP_ENABLED:false}
automation.idle-stop.interval=${AUTOMATION_IDLE_STOP_INTERVAL:300000}
automation.idle-stop.initial-delay=${AUTOMATION_IDLE_STOP_INITIAL_DELAY:120000}
automation.idle-stop.min-dry-run-days=${AUTOMATION_IDLE_STOP_MIN_DRY_RUN_DAYS:14}

# =============================================================================
# Notification System v2 — Email delivery + weekly digest reports
# =============================================================================
# SMTP transport (values from .env — no defaults for secrets)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Master kill-switch — every email path below also checks this first. Disabled by default;
# the in-app bell keeps working regardless of this flag.
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}
notification.email.from=${NOTIFICATION_EMAIL_FROM:noreply@tcgdigital.com}

# Per-event-type email toggles — bell notification always fires regardless of these flags;
# these only gate the additional email. All default off.
notification.email.access-requested.enabled=${NOTIFICATION_EMAIL_ACCESS_REQUESTED_ENABLED:false}
notification.email.access-expiring.enabled=${NOTIFICATION_EMAIL_ACCESS_EXPIRING_ENABLED:false}
notification.email.access-expired.enabled=${NOTIFICATION_EMAIL_ACCESS_EXPIRED_ENABLED:false}
notification.email.access-granted.enabled=${NOTIFICATION_EMAIL_ACCESS_GRANTED_ENABLED:false}
notification.email.access-request-approved.enabled=${NOTIFICATION_EMAIL_ACCESS_REQUEST_APPROVED_ENABLED:false}
notification.email.access-request-denied.enabled=${NOTIFICATION_EMAIL_ACCESS_REQUEST_DENIED_ENABLED:false}
notification.email.access-revoked.enabled=${NOTIFICATION_EMAIL_ACCESS_REVOKED_ENABLED:false}
notification.email.operation-failed.enabled=${NOTIFICATION_EMAIL_OPERATION_FAILED_ENABLED:false}
notification.email.lock-broken.enabled=${NOTIFICATION_EMAIL_LOCK_BROKEN_ENABLED:false}

# Weekly digest reports (Cost / Idle Waste / Rightsizing) — Monday 9:00 AM IST by default.
# Enabled by default (E08-T10): they read the app's own data and only create bell notifications
# unless the per-report email toggles below (and notification.email.enabled) are switched on.
notification.weekly-reports.enabled=${NOTIFICATION_WEEKLY_REPORTS_ENABLED:true}
notification.weekly-reports.cron=${NOTIFICATION_WEEKLY_REPORTS_CRON:0 0 9 * * MON}
notification.email.weekly-cost-report.enabled=${NOTIFICATION_EMAIL_WEEKLY_COST_REPORT_ENABLED:false}
notification.email.weekly-idle-waste-report.enabled=${NOTIFICATION_EMAIL_WEEKLY_IDLE_WASTE_REPORT_ENABLED:false}
notification.email.weekly-rightsizing-report.enabled=${NOTIFICATION_EMAIL_WEEKLY_RIGHTSIZING_REPORT_ENABLED:false}

# Scheduled jobs run on a pool, so a long job never makes another miss its tick (H26).
spring.task.scheduling.pool.size=${SCHEDULER_POOL_SIZE:6}
spring.task.scheduling.thread-name-prefix=sched-

# =============================================================================
# Data retention (E11-T07): nightly batched deletes of old rows. Off until the compliance owner
# confirms the periods. Read notifications go sooner than unread ones.
# =============================================================================
retention.enabled=${RETENTION_ENABLED:false}

# Environment leases (E15). Off by default; each environment also opts in (owner's lease policy).
# Rollout: switch lease.enabled on, opt ONE pilot environment in from its Lease settings for a
# week (it stops on its own when its lease ends), then widen. The sweep needs scheduling on.
# Warning emails also need notification.email.enabled and notification.email.lease-expiring.enabled.
# Platform limits bound every owner's default and maximum; the absolute maximum also bounds
# owner-approved extensions. Warnings fire at each threshold before the end.
lease.enabled=${LEASE_ENABLED:false}
lease.platform.default-minutes=${LEASE_PLATFORM_DEFAULT_MINUTES:240}
lease.platform.max-minutes=${LEASE_PLATFORM_MAX_MINUTES:720}
lease.platform.absolute-max-minutes=${LEASE_PLATFORM_ABSOLUTE_MAX_MINUTES:4320}
lease.warning-minutes=${LEASE_WARNING_MINUTES:60,15,5}
lease.lock-release-grace-minutes=${LEASE_LOCK_RELEASE_GRACE_MINUTES:30}
lease.participant-end-grace-minutes=${LEASE_PARTICIPANT_END_GRACE_MINUTES:15}
lease.sweep.interval-ms=${LEASE_SWEEP_INTERVAL_MS:60000}
notification.email.lease-expiring.enabled=${NOTIFICATION_EMAIL_LEASE_EXPIRING_ENABLED:false}
retention.cron=${RETENTION_CRON:0 0 3 * * *}
retention.audit-log.days=${RETENTION_AUDIT_LOG_DAYS:365}
retention.notification.read-days=${RETENTION_NOTIFICATION_READ_DAYS:90}
retention.notification.unread-days=${RETENTION_NOTIFICATION_UNREAD_DAYS:180}
retention.state-history.days=${RETENTION_STATE_HISTORY_DAYS:180}
retention.email-log.days=${RETENTION_EMAIL_LOG_DAYS:180}
retention.batch-size=${RETENTION_BATCH_SIZE:5000}

# Savings ledger (E17). The baseline is what a VM would have run without the platform; hours it
# was stopped inside the baseline count as saved. 24x7 (MON-SUN, 24 h) is the AWS Instance
# Scheduler convention; e.g. 10 h on MON-FRI models "office hours would have been on anyway".
savings.baseline.hours-per-day=${SAVINGS_BASELINE_HOURS_PER_DAY:24}
savings.baseline.days=${SAVINGS_BASELINE_DAYS:MON-SUN}
# What a stopped VM still pays per public IPv4 address per hour (AWS: $0.005).
savings.ipv4-hourly-rate=${SAVINGS_IPV4_HOURLY_RATE:0.005}
# The daily ledger job (03:30 UTC) re-writes the last N complete days so late history is picked up.
# It only writes to this database, so it is on by default.
savings.ledger.enabled=${SAVINGS_LEDGER_ENABLED:true}
savings.ledger.cron=${SAVINGS_LEDGER_CRON:0 30 3 * * *}
savings.ledger.recompute-days=${SAVINGS_LEDGER_RECOMPUTE_DAYS:3}

# Budgets (E20). The daily evaluation alerts owners at each threshold and on a forecast overrun;
# it writes only app state and in-app notifications. Budget emails also need notification.email.enabled.
budgets.evaluation.enabled=${BUDGETS_EVALUATION_ENABLED:true}
budgets.evaluation.cron=${BUDGETS_EVALUATION_CRON:0 30 5 * * *}
notification.email.budget-alert.enabled=${NOTIFICATION_EMAIL_BUDGET_ALERT_ENABLED:false}
# An exhausted budget requests its action (freeze starts / stop), which an owner must approve.
# Off by default because it changes what users can do.
budgets.actions.enabled=${BUDGETS_ACTIONS_ENABLED:false}
# Mirror budgets into AWS Budgets (monthly COST budgets filtered on the cost-allocation tags).
# Off by default because it changes AWS state; needs budgets:ViewBudget and budgets:ModifyBudget
# (docs/aws-iam-permissions.md) and the account id.
budgets.aws-sync.enabled=${BUDGETS_AWS_SYNC_ENABLED:false}
budgets.aws-sync.account-id=${BUDGETS_AWS_SYNC_ACCOUNT_ID:}

# Cost anomalies (E21). The app creates one tag monitor (tcg:environment=<name>) per environment in
# AWS Cost Anomaly Detection only when this is on, because it changes AWS state.
cost.anomalies.manage-monitors=${COST_ANOMALIES_MANAGE_MONITORS:false}
# Twice-daily ingestion of anomalies: a billed Cost Explorer call per page, so off by default
# (on in the 'cost' profile).
cost.anomalies.enabled=${COST_ANOMALIES_ENABLED:false}
cost.anomalies.cron=${COST_ANOMALIES_CRON:0 0 */12 * * *}
cost.anomalies.lookback-days=${COST_ANOMALIES_LOOKBACK_DAYS:7}
# Owners hear of anomalies of at least this impact (USD); smaller ones show on the pages only.
cost.anomalies.min-impact=${COST_ANOMALIES_MIN_IMPACT:10}
# Also send owners' feedback to AWS (ProvideAnomalyFeedback); changes AWS state, so off.
cost.anomalies.send-feedback-to-aws=${COST_ANOMALIES_SEND_FEEDBACK_TO_AWS:false}
# Anomaly emails also need notification.email.enabled.
notification.email.cost-anomaly.enabled=${NOTIFICATION_EMAIL_COST_ANOMALY_ENABLED:false}

# Waste sweeps (E22): a daily read-only scan for unattached EBS volumes and other account-level
# waste. Off by default; needs the read-only ec2:Describe* calls in docs/aws-iam-permissions.md.
waste.sweep.enabled=${WASTE_SWEEP_ENABLED:false}
# Comma-separated regions to scan; empty means aws.region.
waste.sweep.regions=${WASTE_SWEEP_REGIONS:}
# A volume is reported once it has been unattached at least this many days.
waste.sweep.unattached-days=${WASTE_SWEEP_UNATTACHED_DAYS:32}
waste.sweep.cron=${WASTE_SWEEP_CRON:0 0 4 * * *}
# A stopped VM is reported after this many days; a snapshot after this many days (unless an AMI uses it).
waste.sweep.stopped-days=${WASTE_SWEEP_STOPPED_DAYS:30}
waste.sweep.snapshot-age-days=${WASTE_SWEEP_SNAPSHOT_AGE_DAYS:90}
# Fix actions (snapshot then delete an unattached volume, gp2 -> gp3, archive a snapshot, release
# an Elastic IP) change AWS state: off by default, and each needs a second admin's approval. IAM in
# docs/aws-iam-permissions.md.
waste.actions.enabled=${WASTE_ACTIONS_ENABLED:false}

# Teams (E23): sync team membership from each team's Entra group, hourly. Needs graph.directory.enabled
# and the Graph application permissions GroupMember.Read.All (and Group.Read.All for group search),
# with tenant admin consent. Off by default; manual membership works regardless.
teams.entra-sync.enabled=${TEAMS_ENTRA_SYNC_ENABLED:false}
teams.entra-sync.cron=${TEAMS_ENTRA_SYNC_CRON:0 15 * * * *}
# Required allocation fields (E23-T04): an environment must have a team, and these metadata keys
# (comma-separated), before it is created, edited or gets VMs. Off by default; turn on once
# GET /api/v1/environments/allocation-gaps is empty.
allocation.require-team=${ALLOCATION_REQUIRE_TEAM:false}
allocation.required-metadata-keys=${ALLOCATION_REQUIRED_METADATA_KEYS:}
# Monthly chargeback statement (E23-T07): on day 5 (UTC) last month is frozen and the workbook is
# emailed (Bcc) to these comma-separated finance addresses. Needs notification.email.enabled for the email.
chargeback.enabled=${CHARGEBACK_ENABLED:false}
chargeback.cron=${CHARGEBACK_CRON:0 0 6 5 * *}
chargeback.recipients=${CHARGEBACK_RECIPIENTS:}
# Microsoft Teams chat notifications (E24; Slack is parked, PL-13). Off by default. public-base-url is the app's
# external address, used for links and one-click actions in chat messages.
chat.enabled=${CHAT_ENABLED:false}
chat.public-base-url=${APP_PUBLIC_BASE_URL:}
chat.timeout-ms=${CHAT_TIMEOUT_MS:5000}
# E24-T02: key that encrypts stored webhook URLs (base64 of 32 random bytes; required when chat.enabled),
# and the hosts webhooks may point at ("*.x" = any subdomain of x).
chat.secret-key=${CHAT_SECRET_KEY:}
chat.allowed-webhook-hosts=${CHAT_ALLOWED_WEBHOOK_HOSTS:*.webhook.office.com,*.logic.azure.com,*.api.powerplatform.com}
# E24-T04: one-click action links in chat messages are signed with this key (32+ characters; required
# when chat.enabled) and expire after chat.action-ttl-hours. They run as the signed-in user with the
# normal permission checks. "Stop now" on stop notices stays off until the flow is security-reviewed.
chat.action-signing-key=${CHAT_ACTION_SIGNING_KEY:}
chat.action-ttl-hours=${CHAT_ACTION_TTL_HOURS:24}
chat.actions.stop-enabled=${CHAT_ACTIONS_STOP_ENABLED:false}

# Jira tickets from recommendations and anomalies (E24-T06). Off by default. Jira Cloud: JIRA_EMAIL +
# JIRA_API_TOKEN (Basic); Data Center: JIRA_API_TOKEN alone is sent as a Bearer personal access token.
# Keep the token in the environment only. project-by-team: "Team name or slug=KEY,..." (else project-key).
jira.enabled=${JIRA_ENABLED:false}
jira.base-url=${JIRA_BASE_URL:}
jira.email=${JIRA_EMAIL:}
jira.api-token=${JIRA_API_TOKEN:}
jira.project-key=${JIRA_PROJECT_KEY:}
jira.issue-type=${JIRA_ISSUE_TYPE:Task}
jira.labels=${JIRA_LABELS:vmcontrol,finops}
jira.project-by-team=${JIRA_PROJECT_BY_TEAM:}
jira.timeout-ms=${JIRA_TIMEOUT_MS:10000}

# Cost preview of a start or extension (E25-T01): hours when none are given (the lease default wins
# when leases apply to the environment), and the most hours a preview covers.
cost.preview.default-hours=${COST_PREVIEW_DEFAULT_HOURS:8}
cost.preview.max-hours=${COST_PREVIEW_MAX_HOURS:720}

# Approvals for large or long starts and extensions (E25). Off until the policies are reviewed with
# the environment owners. admin-bypass lets global admins skip approval (off: the control is real).
approvals.enabled=${APPROVALS_ENABLED:false}
approvals.admin-bypass=${APPROVALS_ADMIN_BYPASS:false}
# E25-T04: a held request expires after this many hours; the expiry job runs on this cron (UTC).
approvals.request-ttl-hours=${APPROVALS_REQUEST_TTL_HOURS:24}
approvals.expiry-cron=${APPROVALS_EXPIRY_CRON:0 */10 * * * *}

# Team quotas on running VM-hours or dollars per month (E25-T07). Off by default: then starts are
# never warned, held or blocked by a quota. Members are warned hourly-checked, once per level a month.
quotas.enabled=${QUOTAS_ENABLED:false}
quotas.warning-cron=${QUOTAS_WARNING_CRON:0 5 * * * *}

# EKS node-group metrics (E26-T01): CloudWatch AWS/EC2 metrics per Auto Scaling group, so idle
# detection and rightsizing cover node groups. Container Insights adds a cluster-wide memory figure.
eks.metrics.enabled=${EKS_METRICS_ENABLED:false}
eks.metrics.container-insights.enabled=${EKS_METRICS_CONTAINER_INSIGHTS_ENABLED:false}
# E26-T03: EKS control-plane fee per cluster-hour (0.10 standard support, 0.60 extended support).
eks.pricing.control-plane-hourly=${EKS_PRICING_CONTROL_PLANE_HOURLY:0.10}
# E26-T04: pod/namespace cost from Split Cost Allocation Data (CUR 2.0 Data Exports) via Athena.
# Needs athena:StartQueryExecution/GetQueryExecution/GetQueryResults/StopQueryExecution, glue:GetTable
# and s3:GetObject/PutObject on the output location (docs/aws-iam-permissions.md).
eks.scad.enabled=${EKS_SCAD_ENABLED:false}
eks.scad.cron=${EKS_SCAD_CRON:0 30 6 * * *}
eks.scad.athena.database=${EKS_SCAD_ATHENA_DATABASE:}
eks.scad.athena.table=${EKS_SCAD_ATHENA_TABLE:}
eks.scad.athena.workgroup=${EKS_SCAD_ATHENA_WORKGROUP:primary}
eks.scad.athena.output-location=${EKS_SCAD_ATHENA_OUTPUT_LOCATION:}
eks.scad.athena.region=${EKS_SCAD_ATHENA_REGION:}
eks.scad.workload-tag-column=${EKS_SCAD_WORKLOAD_TAG_COLUMN:resource_tags}
eks.scad.workload-tag-key=${EKS_SCAD_WORKLOAD_TAG_KEY:aws_eks_workload_name}
eks.scad.lookback-days=${EKS_SCAD_LOOKBACK_DAYS:3}
# E26-T02: let idle auto-stop treat EKS node groups like VMs (needs eks.metrics.enabled for samples).
idle.auto-stop.include-eks=${IDLE_AUTO_STOP_INCLUDE_EKS:false}
# Estimated prices, USD (us-east-1 list prices): EBS per GB-month by type, snapshots, public IPv4.
waste.pricing.ebs.gp2=0.10
waste.pricing.ebs.gp3=0.08
waste.pricing.ebs.io1=0.125
waste.pricing.ebs.io2=0.125
waste.pricing.ebs.st1=0.045
waste.pricing.ebs.sc1=0.015
waste.pricing.ebs.standard=0.05
waste.pricing.snapshot-gb-month=0.05
waste.pricing.public-ipv4-month=3.65
# A downsize keeps earning its rate difference for this many days after the resize.
savings.rightsizing.credit-days=${SAVINGS_RIGHTSIZING_CREDIT_DAYS:365}
# Potential savings assume a VM nothing stops (no schedule, no lease, not production) could be off
# for this share of its cost (an assumption from the gap review; shown in the UI).
savings.potential.off-hours-share=${SAVINGS_POTENTIAL_OFF_HOURS_SHARE:0.5}
