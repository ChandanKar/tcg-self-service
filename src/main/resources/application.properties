spring.application.name=vmcontrol

#spring.data.redis.host=localhost
#spring.data.redis.port=6379
#app.redis.embedded.enabled=false

# =============================================================================
# Database configuration — MySQL (local dev and production)
# Values loaded from .env file (no hard-coded defaults for credentials)
# =============================================================================
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.MySQL8Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
# Batches saveAll() calls into grouped JDBC statements instead of one round-trip per entity —
# needed by VmMetricRollupService's per-date saveAll() to keep the rollup job's connection-hold
# time short (see VmMetricRollupService for the full N+1 story this fixes).
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway configuration
spring.flyway.clean-on-validation-error=${FLYWAY_CLEAN_ON_VALIDATION_ERROR:false}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.out-of-order=${FLYWAY_OUT_OF_ORDER:false}

# =============================================================================
# Entra ID (Azure AD) OAuth2 Authentication
# =============================================================================
# Set entraid.enabled=true to enable authentication via Microsoft Entra ID.
# When disabled (false), all requests are permitted.
entraid.enabled=${ENTRAID_ENABLED:true}

# Azure OAuth2 Configuration (values from .env - no defaults for secrets)
spring.security.oauth2.client.registration.azure.provider=azure
spring.security.oauth2.client.registration.azure.client-id=${AZURE_CLIENT_ID}
spring.security.oauth2.client.registration.azure.client-secret=${AZURE_CLIENT_SECRET}
spring.security.oauth2.client.registration.azure.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.azure.scope[0]=openid
spring.security.oauth2.client.registration.azure.scope[1]=profile
spring.security.oauth2.client.registration.azure.scope[2]=email
spring.security.oauth2.client.registration.azure.scope[3]=offline_access
spring.security.oauth2.client.registration.azure.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.azure.authorization-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.azure.token-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token
spring.security.oauth2.client.provider.azure.jwk-set-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID}/discovery/v2.0/keys
spring.security.oauth2.client.provider.azure.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.azure.user-name-attribute=name

# =============================================================================
# AWS Configuration (values from .env - no defaults for secrets)
# =============================================================================
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
aws.region=${AWS_REGION:ap-south-1}

# EC2 start: how long to wait for an instance to reach RUNNING and pass every AWS status
# check (system + instance + attached-EBS) before the start step is reported failed. Those
# checks routinely take 2-5+ min after boot, so 5 min was too tight and flagged healthy VMs
# as failures. Keep below vm.state.sync.stale-transitional-minutes (20m) so a genuinely
# stuck transitional VM is still eventually reconciled.
aws.status-check.timeout-ms=${AWS_STATUS_CHECK_TIMEOUT_MS:900000}
aws.status-check.poll-interval-ms=${AWS_STATUS_CHECK_POLL_INTERVAL_MS:10000}

# Max VMs whose start/stop steps (and their AWS status-check polling) run concurrently
# within a single group/environment operation. VMs with dependencies still wait their turn.
vm.operations.parallelism=${VM_OPERATIONS_PARALLELISM:10}

# =============================================================================
# VM State Sync Configuration
# =============================================================================
# Enable/disable automatic VM state synchronization
vm.state.sync.enabled=${VM_STATE_SYNC_ENABLED:true}
# Sync interval in milliseconds (default: 5 minutes = 300000)
vm.state.sync.interval=${VM_STATE_SYNC_INTERVAL:300000}
# Initial delay before first sync in milliseconds (default: 1 minute = 60000)
vm.state.sync.initial-delay=${VM_STATE_SYNC_INITIAL_DELAY:60000}
# A VM in STARTING/STOPPING longer than this is treated as orphaned (not a real in-flight
# operation) and reconciled against actual cloud state instead of being skipped forever.
# Must stay above the longest single-VM operation timeout (EKS node group scaling: 15 min).
vm.state.sync.stale-transitional-minutes=${VM_STATE_SYNC_STALE_TRANSITIONAL_MINUTES:20}

# =============================================================================
# EKS Sync Configuration
# =============================================================================
# Enable EKS node group sync (opt-in; requires EKS environments to exist in DB)
eks.sync.enabled=${EKS_SYNC_ENABLED:true}
# Comma-separated AWS regions to scan for auto-discovery of new EKS clusters (falls back to aws.region if unset)
eks.sync.regions=${EKS_SYNC_REGIONS:}
# Sync interval in milliseconds (default: 5 minutes)
eks.sync.interval=${EKS_SYNC_INTERVAL:300000}
# Initial delay before first EKS sync in milliseconds (default: 1 minute)
eks.sync.initial-delay=${EKS_SYNC_INITIAL_DELAY:60000}
# Minimum node count to restore when starting a stopped node group (fallback when no saved metadata)
eks.nodegroup.default-min-size=${EKS_DEFAULT_MIN_SIZE:1}
# Poll interval during scale-up/down wait loop in milliseconds
eks.nodegroup.poll-interval-ms=${EKS_POLL_INTERVAL_MS:15000}
# Max time to wait for a scale operation to complete in milliseconds (default: 15 minutes)
eks.nodegroup.operation-timeout-ms=${EKS_OP_TIMEOUT_MS:900000}

# =============================================================================
# VM Auto-Discovery Configuration
# =============================================================================
# Enable tag-based EC2 discovery (opt-in; requires tcg:environment tag on instances)
vm.discovery.enabled=${VM_DISCOVERY_ENABLED:false}
# Discovery interval in milliseconds (default: 10 minutes)
vm.discovery.interval=${VM_DISCOVERY_INTERVAL:600000}
# Initial delay before first discovery run (default: 2 minutes)
vm.discovery.initial-delay=${VM_DISCOVERY_INITIAL_DELAY:120000}
# Discovery strategy: "tag" (match by tag key=env-name) or "name-pattern" (parse Name tag like tcg-backend-1)
vm.discovery.strategy=${VM_DISCOVERY_STRATEGY:tag}
# AWS tag key used to match instances to environments (strategy=tag only)
vm.discovery.tag.environment-key=${VM_DISCOVERY_TAG_ENV_KEY:tcg:environment}
# Name prefix filter for name-pattern strategy — only instances whose Name starts with this are considered
vm.discovery.name-pattern.prefix=${VM_DISCOVERY_NAME_PREFIX:}

# =============================================================================
# VM Inventory and Utilization Metrics Configuration
# =============================================================================
vm.inventory.sync.enabled=${VM_INVENTORY_SYNC_ENABLED:true}
vm.inventory.sync.interval=${VM_INVENTORY_SYNC_INTERVAL:3600000}
vm.inventory.sync.initial-delay=${VM_INVENTORY_SYNC_INITIAL_DELAY:60000}

# Master switch for CloudWatch VM metric collection (vm_metric_sample sync, every N minutes).
# Turning this off also starves the daily rollup below of new data, but does not disable it —
# set cloudwatch.metric.rollup.enable=false separately if you want to stop that too.
cloudwatch.metric.enable=${CLOUDWATCH_METRIC_ENABLE:true}
# Interval in MINUTES (not ms) between CloudWatch GetMetricData sync cycles.
cloudwatch.metric.schedule.interval=${CLOUDWATCH_METRIC_SCHEDULE_INTERVAL:5}
cloudwatch.metric.schedule.initial-delay=${CLOUDWATCH_METRIC_SCHEDULE_INITIAL_DELAY:2}
vm.metrics.period-seconds=${VM_METRICS_PERIOD_SECONDS:300}

# Rolls raw vm_metric_sample rows up into one vm_metric_daily row per VM per day — this is what
# Cost Management's rightsizing recommendations actually read. Re-aggregates the same lookback
# window (vm.metrics.archive.raw-to-archive-days) on every run: cheap (idempotent upsert), keeps
# today's partial-day row fresh, and doubles as a one-time backfill the first time it runs
# against a database that already has un-rolled-up history.
cloudwatch.metric.rollup.enable=${CLOUDWATCH_METRIC_ROLLUP_ENABLE:true}
# Interval in MINUTES between rollup runs — defaults to hourly, not every 5 minutes like the raw
# sync, since a same-day row only needs to stay reasonably fresh, not real-time.
cloudwatch.metric.rollup.schedule.interval=${CLOUDWATCH_METRIC_ROLLUP_SCHEDULE_INTERVAL:60}
cloudwatch.metric.rollup.schedule.initial-delay=${CLOUDWATCH_METRIC_ROLLUP_SCHEDULE_INITIAL_DELAY:3}

vm.metrics.idle.cpu-threshold-percent=${VM_IDLE_CPU_THRESHOLD_PERCENT:5}
vm.metrics.idle.network-threshold-bytes-per-period=${VM_IDLE_NETWORK_THRESHOLD_BYTES_PER_PERIOD:1048576}
vm.metrics.idle.disk-threshold-bytes-per-period=${VM_IDLE_DISK_THRESHOLD_BYTES_PER_PERIOD:1048576}
vm.metrics.idle.minimum-duration-minutes=${VM_IDLE_MINIMUM_DURATION_MINUTES:30}

vm.metrics.archive.enabled=${VM_METRICS_ARCHIVE_ENABLED:true}
vm.metrics.archive.raw-to-archive-days=${VM_METRICS_ARCHIVE_RAW_TO_ARCHIVE_DAYS:30}
vm.metrics.archive.batch-size=${VM_METRICS_ARCHIVE_BATCH_SIZE:10000}
vm.metrics.archive.cron=${VM_METRICS_ARCHIVE_CRON:0 30 2 * * *}

scheduler.lock.default-ttl-ms=${SCHEDULER_LOCK_DEFAULT_TTL_MS:900000}

# =============================================================================
# Cost Management Configuration
# =============================================================================
cost.provider=${COST_PROVIDER:estimated}
cost.snapshot.enabled=${COST_SNAPSHOT_ENABLED:true}
cost.snapshot.cron=${COST_SNAPSHOT_CRON:0 0 3 * * *}

# Cost-allocation tagging (Cost Management Phase 1) — writes tcg:managed-by/environment/team
# tags to real AWS EC2 instances and EKS node groups. Disabled by default: this is a bigger
# blast radius than the rest of Cost Management, which is entirely read-only.
cost.tagging.enabled=${COST_TAGGING_ENABLED:false}
cost.tagging.key-prefix=${COST_TAGGING_KEY_PREFIX:tcg:}
cost.tagging.cron=${COST_TAGGING_CRON:0 30 2 * * *}

# Real billing ingestion (Cost Management Phase 2) — requires Phase 1's tags active in Cost
# Explorer first (24h propagation). Disabled by default; runs once daily since GetCostAndUsage
# is both rate-limited and billed per call.
cost.actuals.enabled=${COST_ACTUALS_ENABLED:false}
cost.actuals.cron=${COST_ACTUALS_CRON:0 0 5 * * *}

# AWS-native optimization signals (Cost Management Phase 3). Compute Optimizer's own API calls
# aren't billed per-request, but reservation/savings-plan coverage uses Cost Explorer, which is.
# Both disabled by default.
cost.optimizer.enabled=${COST_OPTIMIZER_ENABLED:false}
cost.reservations.enabled=${COST_RESERVATIONS_ENABLED:false}
cost.reservations.cron=${COST_RESERVATIONS_CRON:0 15 5 * * *}

# Bidirectional CPU-based rightsizing thresholds. Scale-down: flagged when avg CPU stays below
# the threshold for this many consecutive days. Scale-up: flagged when CPU stays above the
# threshold for this many consecutive minutes (raw 5-minute CloudWatch samples).
rightsizing.scale-down.cpu-threshold=${RIGHTSIZING_SCALE_DOWN_CPU_THRESHOLD:15}
rightsizing.scale-down.consecutive-days=${RIGHTSIZING_SCALE_DOWN_CONSECUTIVE_DAYS:3}
rightsizing.scale-up.cpu-threshold=${RIGHTSIZING_SCALE_UP_CPU_THRESHOLD:70}
rightsizing.scale-up.consecutive-minutes=${RIGHTSIZING_SCALE_UP_CONSECUTIVE_MINUTES:15}

# =============================================================================
# Automation Rules — calendar-schedule and access-grant/lock-acquire auto start/stop
# =============================================================================
automation.rules.enabled=${AUTOMATION_RULES_ENABLED:true}
# Evaluation interval in milliseconds (default: 1 minute = 60000) — matched to the "HH:mm"
# granularity of schedule rules, so sub-minute tick offset doesn't matter.
automation.rules.interval=${AUTOMATION_RULES_INTERVAL:60000}
automation.rules.initial-delay=${AUTOMATION_RULES_INITIAL_DELAY:60000}

# =============================================================================
# Actuator — expose only /actuator/health; lock down everything else
# =============================================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
# Mail is an opt-in feature (notification.email.enabled, off by default) with no SMTP
# configured out of the box — app health must not depend on it being reachable.
management.health.mail.enabled=false

# =============================================================================
# User Management Configuration
# =============================================================================
# Email of user to auto-promote to admin on first OAuth2 login
# This is useful for bootstrapping the first admin user
app.initial-admin-email=${APP_INITIAL_ADMIN_EMAIL:}

# =============================================================================
# Notification System v2 — Email delivery + weekly digest reports
# =============================================================================
# SMTP transport (values from .env — no defaults for secrets)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Master kill-switch — every email path below also checks this first. Disabled by default;
# the in-app bell keeps working regardless of this flag.
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}
notification.email.from=${NOTIFICATION_EMAIL_FROM:noreply@tcgdigital.com}

# Per-event-type email toggles — bell notification always fires regardless of these flags;
# these only gate the additional email. All default off.
notification.email.access-requested.enabled=${NOTIFICATION_EMAIL_ACCESS_REQUESTED_ENABLED:false}
notification.email.access-expiring.enabled=${NOTIFICATION_EMAIL_ACCESS_EXPIRING_ENABLED:false}
notification.email.access-expired.enabled=${NOTIFICATION_EMAIL_ACCESS_EXPIRED_ENABLED:false}
notification.email.access-granted.enabled=${NOTIFICATION_EMAIL_ACCESS_GRANTED_ENABLED:false}
notification.email.access-request-approved.enabled=${NOTIFICATION_EMAIL_ACCESS_REQUEST_APPROVED_ENABLED:false}
notification.email.access-request-denied.enabled=${NOTIFICATION_EMAIL_ACCESS_REQUEST_DENIED_ENABLED:false}
notification.email.access-revoked.enabled=${NOTIFICATION_EMAIL_ACCESS_REVOKED_ENABLED:false}
notification.email.operation-failed.enabled=${NOTIFICATION_EMAIL_OPERATION_FAILED_ENABLED:false}
notification.email.lock-broken.enabled=${NOTIFICATION_EMAIL_LOCK_BROKEN_ENABLED:false}

# Weekly digest reports (Cost / Idle Waste / Rightsizing) — Monday 9:00 AM IST by default.
# Master switch gates the scheduler; each report also has its own email toggle (bell receipt
# always fires regardless, matching the event-type behavior above).
notification.weekly-reports.enabled=${NOTIFICATION_WEEKLY_REPORTS_ENABLED:false}
notification.weekly-reports.cron=${NOTIFICATION_WEEKLY_REPORTS_CRON:0 0 9 * * MON}
notification.email.weekly-cost-report.enabled=${NOTIFICATION_EMAIL_WEEKLY_COST_REPORT_ENABLED:false}
notification.email.weekly-idle-waste-report.enabled=${NOTIFICATION_EMAIL_WEEKLY_IDLE_WASTE_REPORT_ENABLED:false}
notification.email.weekly-rightsizing-report.enabled=${NOTIFICATION_EMAIL_WEEKLY_RIGHTSIZING_REPORT_ENABLED:false}

